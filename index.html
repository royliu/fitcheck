      <div className="pb-28">
        <button onClick={() => { setActiveCat(null); setSwiped(null); }} className="flex items-center gap-1.5 text-[14px] font-extrabold mb-4" style={{ color: "#A99FB5" }}>
          <ArrowLeft size={18} /> Categories
        </button>
        <h1 className="text-2xl font-black mb-1" style={{ color: "#5A5167" }}>Accessories</h1>

                style={{ background: p.bg, minHeight: 104 }}>
                <div className="w-10 h-10 rounded-2xl flex items-center justify-center mb-2" style={{ background: "#ffffffcc" }}>
                  <Icon size={20} color={p.text} />

              </button>
            );
          })}
        </div>

    );
  }

  /* ---- Item list (category, accessory sub-category, or the cross-cutting
     Laundry/Liked views) ---- */
  if (activeCat) {
    // Laundry and Liked aren't real categories — they filter across ALL of them
    // by wash/fav status instead, so an item can show up here no matter what
    // category it's actually filed under.
    const isCrossCut = activeCat === "Laundry" || activeCat === "Liked";
    const items = activeCat === "Laundry" ? closet.filter((i) => i.wash)
      : activeCat === "Liked" ? closet.filter((i) => i.fav)
      : activeSub ? closet.filter((i) => i.category === "Accessories" && i.subcategory === activeSub)
      : closet.filter((i) => i.category === activeCat);
    const title = activeSub || activeCat;
    const goBack = activeSub ? () => { setActiveSub(null); setSwiped(null); } : () => { setActiveCat(null); setSwiped(null); };
    return (
      <div className="pb-28">
        <button onClick={goBack} className="flex items-center gap-1.5 text-[14px] font-extrabold mb-4" style={{ color: "#A99FB5" }}>

        <div className="space-y-3 mt-4">
          {items.length === 0 ? (

              <div className="text-[15px] font-black" style={{ color: "#A99FB5" }}>No {title.toLowerCase()} yet</div>
              <p className="text-[13px] font-semibold mt-1" style={{ color: "#C6BCD2" }}>

  /* ---- Category grid (home) ---- */

    <div className="pb-28">
      <h1 className="text-[34px] leading-tight font-black mb-4" style={{ color: "#5A5167" }}>My Closet</h1>
      <div className="relative mb-5">

        <input value={query} onChange={(e) => setQuery(e.target.value)}

                  <Icon size={22} color={p.text} />
                </div>
                <div className="text-[15px] font-black" style={{ color: p.text }}>{c.key}</div>
                <div className="text-[12px] font-bold" style={{ color: p.text + "bb" }}>{plural(counts[c.key], "piece")}</div>
              </button>

          {/* Laundry / Liked — cross-cutting views (wash/fav), not real categories */}
          <button onClick={() => setActiveCat("Laundry")}
            className="rounded-3xl p-4 text-left active:scale-95 transition-transform"
            style={{ background: PASTELS[5 % PASTELS.length].bg, minHeight: 110 }}>
            <div className="w-11 h-11 rounded-2xl flex items-center justify-center mb-2" style={{ background: "#ffffffcc" }}>
              <ShoppingBasket size={22} color={PASTELS[5 % PASTELS.length].text} />
            </div>
            <div className="text-[15px] font-black" style={{ color: PASTELS[5 % PASTELS.length].text }}>Laundry</div>
            <div className="text-[12px] font-bold" style={{ color: PASTELS[5 % PASTELS.length].text + "bb" }}>{plural(counts.Laundry, "piece")}</div>
          </button>
          <button onClick={() => setActiveCat("Liked")}
            className="rounded-3xl p-4 text-left active:scale-95 transition-transform"
            style={{ background: PASTELS[6 % PASTELS.length].bg, minHeight: 110 }}>
            <div className="w-11 h-11 rounded-2xl flex items-center justify-center mb-2" style={{ background: "#ffffffcc" }}>
              <Heart size={22} color={PASTELS[6 % PASTELS.length].text} />
            </div>
            <div className="text-[15px] font-black" style={{ color: PASTELS[6 % PASTELS.length].text }}>Liked</div>
            <div className="text-[12px] font-bold" style={{ color: PASTELS[6 % PASTELS.length].text + "bb" }}>{plural(counts.Liked, "piece")}</div>
          </button>
          {/* Trash tile */}
          <button onClick={() => setInTrash(true)}
            className="rounded-3xl p-4 text-left active:scale-95 transition-transform"
            style={{ background: "#F6EEF6", minHeight: 110 }}>
            <div className="w-11 h-11 rounded-2xl flex items-center justify-center mb-2" style={{ background: "#ffffffcc" }}>
              <Trash2 size={22} color="#A99FB5" />
            </div>
            <div className="text-[15px] font-black" style={{ color: "#8A7FA0" }}>Trash</div>
            <div className="text-[12px] font-bold" style={{ color: "#A99FB5" }}>{plural(trash.length, "item")}</div>
          </button>
        </div>
      )}
      {detailModal}
    </div>
  );
}

/* ---------- Reusable camera hook ---------- */
function useCamera(active = true) {
  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const streamRef = useRef(null);
  const [camState, setCamState] = useState("starting"); // starting | live | denied | unavailable
  const [facing, setFacing] = useState("environment"); // "environment" (back) | "user" (front)

  const stopStream = () => {
    if (streamRef.current) {
      streamRef.current.getTracks().forEach((t) => t.stop());
      streamRef.current = null;
    }
  };

  const startCamera = async (mode) => {
    const want = mode || facing;
    setCamState("starting");
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setCamState("unavailable");
      return;
    }
    stopStream();
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: want } },
        audio: false,
      });
      streamRef.current = stream;
      if (videoRef.current) {
        videoRef.current.srcObject = stream;
        await videoRef.current.play().catch(() => {});
      }
      setCamState("live");
    } catch (err) {
      setCamState(err && err.name === "NotAllowedError" ? "denied" : "unavailable");
    }
  };

  const flipCamera = () => {
    const next = facing === "environment" ? "user" : "environment";
    setFacing(next);
    startCamera(next);
  };

  useEffect(() => {
    if (active) startCamera(); else stopStream();
    return stopStream;
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [active]);

  // Re-wire the <video> to the stream if it remounts into view
  useEffect(() => {
    if (camState === "live" && videoRef.current && streamRef.current && !videoRef.current.srcObject) {
      videoRef.current.srcObject = streamRef.current;
      videoRef.current.play().catch(() => {});
    }
  });

  // Capture current frame cropped to 3:4, returns a jpeg data URL (or null)
  const capture = () => {
    const video = videoRef.current;
    const canvas = canvasRef.current;
    if (camState === "live" && video && canvas && video.videoWidth) {
      const vw = video.videoWidth, vh = video.videoHeight;
      const targetRatio = 3 / 4;
      let sw = vw, sh = vw / targetRatio;
      if (sh > vh) { sh = vh; sw = vh * targetRatio; }
      const sx = (vw - sw) / 2, sy = (vh - sh) / 2;
      canvas.width = 600; canvas.height = 800;
      canvas.getContext("2d").drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL("image/jpeg", 0.85);
    }
    return null;
  };

  return { videoRef, canvasRef, camState, facing, startCamera, flipCamera, capture, stopStream };
}

function CameraTab({ onAdd, active, corrections, onCorrect, compact }) {
  const { videoRef, canvasRef, camState, facing, startCamera, flipCamera, capture, stopStream } = useCamera(active);
  const fileRef = useRef(null);
  const [scanning, setScanning] = useState(false);
  const [stage, setStage] = useState("");
  const [photo, setPhoto] = useState(null);   // displayed data URL
  const [results, setResults] = useState(null); // [{name, category, subcategory, color, photo}]
  const [error, setError] = useState(null);
  const [picker, setPicker] = useState(null); // index of the item whose category picker is open
  const [colorPicker, setColorPicker] = useState(null); // index of the item whose color picker is open
  const [loadPct, setLoadPct] = useState(0);
  // The model loaders report progress per-FILE, so the raw number jumps backward
  // between files. Clamp it to never decrease, and ignore sub-1% wiggle, so the
  // bar climbs smoothly instead of flickering between numbers.
  useEffect(() => onModelProgress((p) => setLoadPct((prev) => {
    const next = Math.max(prev, p);
    return Math.round(next * 100) === Math.round(prev * 100) ? prev : next;
  })), []);

  // Warm the detector the instant the camera screen opens, so the FIRST scan
  // runs inference on an ALREADY-LOADED model. This matters most during
  // onboarding: the app-level warm-up is gated on `onboarded`, so before this a
  // brand-new user's first scan cold-loaded the model AND ran inference at the
  // same instant — the cold-load transient (download buffer + copy + parsed
  // session) stacked under the inference activations is the memory spike that
  // reloaded the tab mid-scan. Post-onboarding scans never hit this because the
  // model is already warm, which is exactly why they didn't crash. Warming on
  // camera-open (while the user is still framing the shot) spreads that load out
  // so it isn't piled on top of inference. Best-effort; the scan awaits the same
  // in-flight load via getDetector()'s promise guard.
  useEffect(() => { if (active) getDetector().catch(() => {}); }, [active]);

  const setItemCategory = (i, category, subcategory) => {
    const sub = category === "Accessories" ? (subcategory || (results && results[i] && results[i].subcategory) || "Jewelry") : null;
    setResults((rs) => rs.map((r, j) => j === i ? { ...r, category, subcategory: sub } : r));
    const it = results && results[i];
    if (it && onCorrect) onCorrect(it.noun || it.name, category, sub);   // teach this fix for next time
  };

  // Add the current photo as an item the detector didn't find (jewelry, hairclips, …).
  const addManual = () => {
    const idx = (results || []).length;
    setResults((rs) => [...(rs || []), { name: "New Item", category: "Accessories", subcategory: "Jewelry", color: "Neutral", photo }]);
    setError(null);
    setPicker(idx);
  };

  const removeItem = (i) => setResults((rs) => { const next = (rs || []).filter((_, j) => j !== i); return next.length ? next : null; });
  const renameItem = (i, name) => setResults((rs) => rs.map((r, j) => j === i ? { ...r, name } : r));
  const setItemColor = (i, color) => setResults((rs) => rs.map((r, j) => j === i ? { ...r, color } : r));

  const processImage = async (dataUrl) => {
    // Release the camera hardware before the heavy ML work starts. On a phone,
    // a live camera stream still decoding frames in the background WHILE the
    // WASM models run inference appears to be exactly the combination that
    // crashes/reloads the tab (uploading a photo — no live stream — doesn't
    // hit this). The stream restarts automatically via retake().
    stopStream();
    setResults(null);
    setError(null);
    setScanning(true);
    // Stamp every stage change to localStorage (survives an actual page reload,
    // unlike React state) — if the app ever comes back up with a leftover
    // breadcrumb here, it means the LAST scan died mid-flight instead of
    // finishing normally, and we know exactly which step it was on.
    const stageAndMark = (s) => { setStage(s); markScanStage(s); };
    stageAndMark("Getting ready…");
    try {
      // Cap the photo before doing anything else with it. An uncapped
      // multi-megapixel photo (common for a full-body "picture of myself"
      // upload) held alongside 3 in-browser ML models can spike memory hard
      // enough to crash the tab on a phone — losing the photo and the pending
      // scan before you can confirm it. Both copies are derived straight from
      // the ORIGINAL (not chained through each other) — re-compressing an
      // already-compressed JPEG stacks quality loss and was quietly hurting
      // detection accuracy (shoes especially, being a smaller/harder region).
      const safePhoto = await downscaleDataUrl(dataUrl, 1600).catch(() => dataUrl);
      setPhoto(safePhoto);
      const ds = await downscaleDataUrl(dataUrl, 1000);
      const { items, annotated } = await detectGarments(ds, stageAndMark, corrections, safePhoto);
      setResults(items);
      if (annotated) setPhoto(annotated); // show the labeled boxes over the photo
      if (!items.length) setError("No items found — make sure the WHOLE item is in the frame and step back a bit. A close-up of just part of an item won't be recognized.");
    } catch (e) {
      // A failed cross-origin module import (common in the standalone web app)
      // surfaces as a cryptic "importing a module script failed" — turn that (and
      // our own tagged MODEL_LOAD_FAILED) into something a user can act on.
      const raw = (e && e.message) || "";
      const isLoad = (e && e.isModelLoad) || /module script|importing a module|dynamically imported|Failed to fetch|Load failed/i.test(raw);
      setError(isLoad
        ? "Couldn't load the styling tools — this usually means a weak connection. Tap Try again."
        : (raw || "Something went wrong while scanning."));
    } finally {
      setScanning(false);
      clearScanStage();   // finished (success or caught error) — no longer "interrupted"
    }
  };

  const snap = () => {
    const d = capture();
    if (!d) { setError("Couldn't capture from the camera — try Upload instead."); return; }
    processImage(d);
  };

  const onFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => processImage(reader.result);
    reader.readAsDataURL(file);
    e.target.value = "";
  };

  const confirmAll = () => {
    (results || []).forEach((r) => onAdd({ name: r.name, category: r.category, subcategory: r.subcategory || null, color: r.color, photo: r.photo, id: uid(), fav: false, wash: false }));
    setResults(null);
    setPhoto(null);
    setError(null);
    setPicker(null);
    startCamera();   // resume the live view so the next item can be snapped right away
  };

  const retake = () => {
    setResults(null);
    setPhoto(null);
    setError(null);
    startCamera();   // resume the live view — processImage() released it before scanning
  };

  return (
    <div className={compact ? "" : "pb-28"}>
      <h1 className="text-[34px] leading-tight font-black mb-2" style={{ color: "#5A5167" }}>
        {compact ? "Take your first picture of your clothes" : "Take a picture of your clothes"}
      </h1>
      <p className="text-[13.5px] font-semibold mb-2" style={{ color: "#A99FB5" }}>
        {compact
          ? "Lay out or hang up a few pieces — we'll pick out every item in the shot."
          : "Lay out or hang up a few pieces at a time — we'll pick out every item in the shot. Snap as many rounds as you need to add your whole wardrobe."}
      </p>

      {/* Viewfinder */}
      <div className="relative rounded-3xl overflow-hidden mb-7 mt-6"
        style={{ aspectRatio: "3/4", background: "linear-gradient(160deg,#2b2b33,#3d3a44)" }}>

        {/* live video (hidden once a photo is frozen) */}
        <video ref={videoRef} playsInline muted
          className="absolute inset-0 w-full h-full object-cover"
          style={{ display: camState === "live" && !photo ? "block" : "none" }} />

        {/* frozen captured photo */}
        {photo && (
          <img src={photo} alt="capture" className="absolute inset-0 w-full h-full object-cover" />
        )}

        {/* dim overlay while scanning a photo */}
        {scanning && photo && <div className="absolute inset-0" style={{ background: "#00000055" }} />}

        <canvas ref={canvasRef} className="hidden" />

        {/* corner guides */}
        {[["top-4 left-4","border-t-2 border-l-2"],["top-4 right-4","border-t-2 border-r-2"],["bottom-4 left-4","border-b-2 border-l-2"],["bottom-4 right-4","border-b-2 border-r-2"]].map(([pos,b],k)=>(
          <div key={k} className={`absolute ${pos} ${b} w-10 h-10 rounded-md`} style={{ borderColor: "#FDE9F1" }} />
        ))}

        <div className="absolute inset-0 flex items-center justify-center px-6 text-center">
          {scanning ? (() => {
            const pct = loadPct >= 0.999 ? (((stage || "").includes("Naming")) ? 96 : 90) : Math.max(2, Math.round(loadPct * 88));
            return (
              <div className="w-full px-8">
                <Sparkles size={44} className="mb-3 mx-auto animate-bounce text-white" />
                <div className="text-white/90 font-extrabold text-base text-center">{stage || "Scanning…"}</div>
                <div className="mx-auto mt-3 h-2 rounded-full overflow-hidden" style={{ background: "#ffffff33", maxWidth: 240 }}>
                  <div className="h-full rounded-full" style={{ width: pct + "%", background: "#F8A7C5", transition: "width .3s ease" }} />
                </div>
                <div className="text-white/80 font-bold text-xs text-center mt-1.5">{pct}%</div>
                <div className="text-white/50 font-semibold text-[11px] text-center mt-1">First time loads the AI — instant after that.</div>
              </div>
            );
          })() : camState === "starting" ? (
            <div>
              <Loader2 size={40} className="mb-2 mx-auto animate-spin text-white/80" />
              <div className="text-white/70 font-bold text-base">Starting camera…</div>
            </div>
          ) : (camState === "denied" || camState === "unavailable") && !photo ? (
            <div>
              <CameraIcon size={44} className="mb-2 mx-auto text-white/70" />
              <div className="text-white/90 font-extrabold text-base mb-1">{camState === "denied" ? "Camera access blocked" : "No camera available"}</div>
              <div className="text-white/60 font-semibold text-sm mb-3">Use Upload below, or allow the camera and retry.</div>
              <button onClick={startCamera} className="px-4 py-2 rounded-full text-[13px] font-extrabold" style={{ background: "#FBB8D2", color: "#7A3556" }}>Retry camera</button>
            </div>
          ) : (!photo && camState === "live") ? (
            <div className="text-white/70 font-bold text-base self-end mb-4" style={{ position: "absolute", bottom: 0 }}>Frame your clothes & tap the shutter</div>
          ) : null}
        </div>

        {/* scan line */}
        {scanning && (
          <div className="absolute left-0 right-0 h-1" style={{ background: "#F8A7C5", boxShadow: "0 0 16px 4px #F8A7C5", animation: "scan 1.5s linear infinite" }} />
        )}

      </div>

      {/* hidden upload input */}
      <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={onFile} />

      {/* Shutter + Upload — flip camera sits at the far right of the row, near the
          edge, the way Apple's Camera app lays out its bottom controls. */}
      {!results && !scanning && (
        <div className="flex flex-col items-center gap-4 mt-2">
          <div className="w-full flex items-center justify-between px-3">
            <div style={{ width: 44 }} />{/* balances the flip button on the right so the shutter stays truly centered */}
            <button onClick={snap} disabled={camState === "starting"}
              className="w-24 h-24 rounded-full flex items-center justify-center active:scale-90 transition-transform disabled:opacity-50"
              style={{ background: "#fff", boxShadow: "0 0 0 6px #FBD0E2, 0 8px 24px -4px #F3B6D055" }}>
              <CameraIcon size={36} color="#E891B5" />
            </button>
            {camState === "live" && !photo ? (
              <button onClick={flipCamera} aria-label="switch camera"
                className="rounded-full flex items-center justify-center active:scale-90 transition-transform"
                style={{ width: 44, height: 44, background: "#F4EEF5" }}>
                <RefreshCw size={20} color="#8A7FA0" />
              </button>
            ) : (
              <div style={{ width: 44 }} />
            )}
          </div>
          <button onClick={() => fileRef.current && fileRef.current.click()}
            className="flex items-center gap-2 px-5 py-2.5 rounded-full text-[13px] font-extrabold active:scale-95 transition-transform"
            style={{ background: "#F4EEF5", color: "#8A7FA0" }}>
            <Plus size={16} /> Upload a photo
          </button>
        </div>
      )}

      {/* Error */}
      {error && !scanning && (
        <div className="rounded-3xl p-4 mt-4 text-center" style={{ background: "#FCEDE6" }}>
          <div className="text-[13.5px] font-bold" style={{ color: "#CC8567" }}>{error}</div>
          <div className="flex items-center justify-center gap-4 mt-2">
            {photo && <button onClick={addManual} className="text-[13px] font-extrabold" style={{ color: "#C56B96" }}>Add it manually</button>}
            <button onClick={retake} className="text-[13px] font-extrabold" style={{ color: "#C56B96" }}>Try again</button>
          </div>
        </div>
      )}

      {/* Results — every garment found in the photo */}
      {results && results.length > 0 && (
        <div className="rounded-3xl p-5 mt-1" style={{ background: "#FDE9F1" }}>
          <div className="text-[16px] font-black mb-1" style={{ color: "#C56B96" }}>
            Identified {results.length} piece{results.length !== 1 ? "s" : ""}
          </div>
          <div className="text-[12px] font-semibold mb-3" style={{ color: "#C99BB5" }}>
            See them outlined on your photo above — add the ones you want.
          </div>
          <div className="space-y-2.5 mb-4">
            {results.map((r, i) => (
              <div key={i} className="flex items-center gap-3 p-2.5 rounded-2xl" style={{ background: "#ffffffcc" }}>
                <div className="w-14 h-14 rounded-xl overflow-hidden flex items-center justify-center shrink-0" style={{ background: "#fff" }}>
                  <img src={r.photo} alt="" className="w-full h-full object-cover" />
                </div>
                <div className="flex-1 min-w-0">
                  <input value={r.name} onChange={(e) => renameItem(i, e.target.value)} spellCheck={false}
                    className="text-[14px] font-black w-full bg-transparent outline-none rounded px-1 -ml-1 focus:bg-white"
                    style={{ color: "#5A5167" }} />
                  <div className="flex gap-1.5 mt-1 flex-wrap items-center">
                    <button onClick={() => setPicker(i)} className="px-2 py-0.5 rounded-full text-[10px] font-extrabold flex items-center gap-1" style={{ background: "#FDE9F1", color: "#C56B96" }}>
                      {r.category}{r.subcategory ? " · " + r.subcategory : ""} <ChevronDown size={10} />
                    </button>
                    <button onClick={() => setColorPicker(i)} className="px-2 py-0.5 rounded-full text-[10px] font-extrabold flex items-center gap-1" style={{ background: "#F1ECFB", color: "#8E78C0" }}>
                      <span className="inline-block w-2.5 h-2.5 rounded-full" style={{ background: (COLOR_CHOICES.find((c) => c[0] === r.color) || ["", "#bbb"])[1], border: "1px solid #00000022" }} />
                      {r.color} <ChevronDown size={10} />
                    </button>
                  </div>
                </div>
                <button onClick={() => removeItem(i)} aria-label="remove item"
                  className="w-8 h-8 rounded-full flex items-center justify-center shrink-0 active:scale-90 transition-transform" style={{ background: "#FAD4D4" }}>
                  <X size={16} color="#D96A6A" />
                </button>
              </div>
            ))}
          </div>
          <button onClick={addManual}
            className="w-full py-2.5 mb-3 rounded-2xl text-[13px] font-extrabold flex items-center justify-center gap-1.5 border-2 border-dashed"
            style={{ borderColor: "#F3C6DC", color: "#C56B96", background: "#fff7fb" }}>
            <Plus size={16} /> Add a piece manually (jewelry, hairclip…)
          </button>
          <button onClick={confirmAll}
            className="w-full py-3.5 rounded-2xl text-white font-black text-[15px] flex items-center justify-center gap-2 active:scale-95 transition-transform"
            style={{ background: "linear-gradient(135deg,#FBB8D2,#F3A7CB)" }}>
            <Check size={20} /> Add {results.length} to Closet
          </button>
          <button onClick={retake} className="w-full py-3 mt-1 text-[13px] font-bold" style={{ color: "#C99BB5" }}>Retake</button>
        </div>
      )}

      {/* Category picker sheet */}
      {picker !== null && results && results[picker] && (
        <div className="fixed inset-0 z-50 flex items-end" style={{ background: "#00000055" }} onClick={() => setPicker(null)}>
          <div className="w-full rounded-t-3xl p-5 pb-9 mx-auto" style={{ maxWidth: 430, background: "#fff" }} onClick={(e) => e.stopPropagation()}>
            <div className="mx-auto mb-4 h-1.5 w-12 rounded-full" style={{ background: "#EFE3F0" }} />
            <div className="text-[16px] font-black mb-3" style={{ color: "#5A5167" }}>Where does this go?</div>
            <div className="flex flex-wrap gap-2 mb-3">
              {CATEGORIES.map((c) => {
                const on = results[picker].category === c.key;
                return (
                  <button key={c.key} onClick={() => setItemCategory(picker, c.key, results[picker].subcategory)}
                    className="px-4 py-2 rounded-full text-[14px] font-extrabold active:scale-95 transition-all"
                    style={{ background: on ? "#FDE9F1" : "#F4EEF5", color: on ? "#C56B96" : "#A99FB5" }}>{c.key}</button>
                );
              })}
            </div>
            {results[picker].category === "Accessories" && (
              <>
                <div className="text-[11px] font-bold uppercase tracking-wide mb-2" style={{ color: "#A99FB5" }}>Sub-category</div>
                <div className="flex flex-wrap gap-2">
                  {ACCESSORY_SUBCATS.map((s) => {
                    const on = results[picker].subcategory === s.key;
                    return (
                      <button key={s.key} onClick={() => setItemCategory(picker, "Accessories", s.key)}
                        className="px-4 py-2 rounded-full text-[13px] font-extrabold active:scale-95 transition-all"
                        style={{ background: on ? "#F1ECFB" : "#F4EEF5", color: on ? "#8E78C0" : "#A99FB5" }}>{s.key}</button>
                    );
                  })}
                </div>
              </>
            )}
            <button onClick={() => setPicker(null)} className="w-full mt-6 py-3 rounded-2xl text-white font-black" style={{ background: "linear-gradient(135deg,#FBB8D2,#F3A7CB)" }}>Done</button>
          </div>
        </div>
      )}

      {/* Color picker sheet */}
      {colorPicker !== null && results && results[colorPicker] && (
        <div className="fixed inset-0 z-50 flex items-end" style={{ background: "#00000055" }} onClick={() => setColorPicker(null)}>
          <div className="w-full rounded-t-3xl p-5 pb-9 mx-auto" style={{ maxWidth: 430, background: "#fff" }} onClick={(e) => e.stopPropagation()}>
            <div className="mx-auto mb-4 h-1.5 w-12 rounded-full" style={{ background: "#EFE3F0" }} />
            <div className="text-[16px] font-black mb-3" style={{ color: "#5A5167" }}>What color is it?</div>
            <div className="flex flex-wrap gap-2">
              {COLOR_CHOICES.map(([name, hex]) => {
                const on = results[colorPicker].color === name;
                return (
                  <button key={name} onClick={() => setItemColor(colorPicker, name)}
                    className="px-3 py-2 rounded-full text-[12px] font-extrabold flex items-center gap-1.5 active:scale-95 transition-all"
                    style={{ background: "#F4EEF5", color: on ? "#C56B96" : "#6E6480", border: on ? "2px solid #F3A7CB" : "2px solid transparent" }}>
                    <span className="inline-block w-3 h-3 rounded-full" style={{ background: hex, border: "1px solid #00000022" }} />
                    {name}
                  </button>
                );
              })}
            </div>
            <button onClick={() => setColorPicker(null)} className="w-full mt-6 py-3 rounded-2xl text-white font-black" style={{ background: "linear-gradient(135deg,#FBB8D2,#F3A7CB)" }}>Done</button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------- Toast ---------- */
function Toast({ msg }) {
  if (!msg) return null;
  return (
    <div className="fixed left-1/2 -translate-x-1/2 px-5 py-3 rounded-full font-extrabold text-[13px] text-white z-50"
      style={{ bottom: 110, background: "#7E6CA8", boxShadow: "0 8px 24px -6px #7E6CA8aa" }}>
      {msg}
    </div>
  );
}

/* Persistent banner (not a toast — stays up) telling an already-open tab that a
   newer build has been deployed, with a one-tap refresh. */
function UpdateBanner({ show }) {
  if (!show) return null;
  return (
    <div className="fixed left-1/2 -translate-x-1/2 z-[60] px-4" style={{ top: 14, width: "100%", maxWidth: 430 }}>
      <div className="flex items-center gap-3 px-4 py-3 rounded-2xl shadow-lg" style={{ background: "#2D2A38" }}>
        <Sparkles size={16} color="#F3A7CB" className="shrink-0" />
        <span className="flex-1 text-[12.5px] font-bold text-white leading-snug">A newer version of FitCheck is ready</span>
        <button onClick={() => { try { const u = new URL(location.href); u.searchParams.set("v", Date.now()); location.replace(u.toString()); } catch (e) { location.reload(); } }}
          className="shrink-0 flex items-center gap-1.5 px-3 py-2 rounded-xl text-[12px] font-extrabold active:scale-95 transition-transform"
          style={{ background: "#F3A7CB", color: "#2D2A38" }}>
          <RotateCcw size={13} /> Refresh
        </button>
      </div>
    </div>
  );
}

/* ================= ONBOARDING ================= */
/* Shared 4-segment progress bar — one segment per step (style, aesthetic,
   first photo, account) — used by Onboarding itself plus the two step
   components that live outside it (OnboardingCloset, OnboardingAccount). */
function OnboardingProgress({ n }) {
  return (
    <div className="flex gap-2 mb-10">
      {[0, 1, 2, 3].map((i) => (
        <div key={i} className="h-1.5 rounded-full flex-1" style={{ background: i < n ? "#F3A7CB" : "#EFE3F0" }} />
      ))}
    </div>
  );
}
function Onboarding({ onDone, onAddItem, corrections, onCorrect, onSignInGoogle, onSignUpEmail, onSignInEmail, onForgotPassword, authError, user }) {
  const [step, setStep] = useState("base"); // base | aesthetic | closet | account
  const [base, setBase] = useState(null);   // "Cali" | "Korean"
  const [picked, setPicked] = useState([]);
  const [collected, setCollected] = useState(null); // { aesthetics, baseStyle } once the closet step finishes
  const [addedCount, setAddedCount] = useState(0);  // pieces added to the real closet during the closet step

  const toggle = (a) =>
    setPicked((p) => (p.includes(a) ? p.filter((x) => x !== a) : [...p, a]));
  const handleAddItem = (item) => { onAddItem(item); setAddedCount((n) => n + 1); };

  // Once something's actually been added to the closet, move on automatically —
  // no need for "Skip for now" anymore since there's nothing left to skip. The
  // short delay lets the "added to your closet" confirmation actually be seen.
  useEffect(() => {
    if (addedCount === 0) return;
    const t = setTimeout(() => { setCollected({ aesthetics: picked, baseStyle: base }); setStep("account"); }, 900);
    return () => clearTimeout(t);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [addedCount]);

  return (
    <div style={{ fontFamily: "'Nunito', sans-serif", background: "linear-gradient(180deg,#FDF1F6,#F1F4FC)", minHeight: "100vh" }}>
      <div className="mx-auto relative" style={{ maxWidth: 430, minHeight: "100vh", background: "linear-gradient(180deg,#FFFCFE,#FBFAFF)" }}>
        {step === "base" ? (
          <div className="px-6 pt-16 pb-10">
            <OnboardingProgress n={1} />
            <div className="text-[15px] font-black tracking-widest mb-2" style={{ color: "#C56B96" }}>WELCOME TO FITCHECK</div>
            <h1 className="text-[38px] leading-tight font-black mb-2" style={{ color: "#5A5167" }}>Which style do you prefer?</h1>
            <p className="text-[16px] font-semibold mb-6" style={{ color: "#A99FB5" }}>We'll base your looks on this vibe — then layer your aesthetics on top.</p>

            <div className="grid grid-cols-2 gap-3">
              {[
                { k: "Cali", sub: "Sun-washed, relaxed, easy", bg: "#FFF6DE", text: "#C39A3E" },
                { k: "Korean", sub: "Clean, trend-forward, polished", bg: "#F1ECFB", text: "#8E78C0" },
              ].map((o) => {
                const on = base === o.k;
                return (
                  <button key={o.k} onClick={() => setBase(o.k)}
                    className="rounded-3xl p-5 text-left active:scale-95 transition-all"
                    style={{ background: o.bg, minHeight: 140, outline: on ? `3px solid ${o.text}` : "3px solid transparent" }}>
                    <div className="text-[24px] font-black" style={{ color: o.text }}>{o.k}</div>
                    <div className="text-[12.5px] font-bold mt-1" style={{ color: o.text + "cc" }}>{o.sub}</div>
                    {on && <div className="mt-3"><Check size={18} color={o.text} /></div>}
                  </button>
                );
              })}
            </div>

            <div className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full px-6 pb-7" style={{ maxWidth: 430 }}>
              <button disabled={!base} onClick={() => setStep("aesthetic")}
                className="w-full py-4 rounded-full text-white font-black text-[16px] flex items-center justify-center gap-2 active:scale-95 transition-transform disabled:opacity-40"
                style={{ background: "linear-gradient(135deg,#FBB8D2,#D6B5F0)", boxShadow: "0 12px 30px -6px #F3B6D0aa" }}>
                {base ? "Continue" : "Pick one"}{base && <ArrowRight size={20} />}
              </button>
            </div>
          </div>
        ) : step === "aesthetic" ? (
          <div className="px-6 pt-16 pb-10">
            <OnboardingProgress n={2} />
            <button onClick={() => setStep("base")} className="flex items-center gap-1.5 text-[14px] font-extrabold mb-4" style={{ color: "#A99FB5" }}>
              <ArrowLeft size={18} /> Back
            </button>
            <h1 className="text-[38px] leading-tight font-black mb-2" style={{ color: "#5A5167" }}>What's your aesthetic?</h1>
            <p className="text-[16px] font-semibold mb-5" style={{ color: "#A99FB5" }}>Pick the vibes you love — they layer on top of your {base} base.</p>

            <div className="flex flex-wrap gap-2.5">
              {AESTHETICS.map((a, i) => {
                const on = picked.includes(a);
                const p = PASTELS[i % PASTELS.length];
                return (
                  <button key={a} onClick={() => toggle(a)}
                    className="px-5 py-3 rounded-full text-[15px] font-extrabold active:scale-95 transition-all"
                    style={{
                      background: on ? p.bg : "#F6EEF6",
                      color: on ? p.text : "#A99FB5",
                      transform: on ? "scale(1.03)" : "scale(1)",
                    }}>
                    {a}
                  </button>
                );
              })}
            </div>

            <p className="text-[13px] font-semibold mt-5 flex items-center gap-1.5" style={{ color: "#B8AFC6" }}>
              <Sparkles size={13} /> You can always change these later in your Profile.
            </p>

            <div className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full px-6 pb-7" style={{ maxWidth: 430 }}>
              <button disabled={picked.length === 0} onClick={() => setStep("closet")}
                className="w-full py-4 rounded-full text-white font-black text-[16px] flex items-center justify-center gap-2 active:scale-95 transition-transform disabled:opacity-40"
                style={{ background: "linear-gradient(135deg,#FBB8D2,#D6B5F0)", boxShadow: "0 12px 30px -6px #F3B6D0aa" }}>
                {picked.length === 0 ? "Pick at least one" : "Continue"}
                {picked.length > 0 && <ArrowRight size={20} />}
              </button>
            </div>
          </div>
        ) : step === "closet" ? (
          <div>
            <div className="px-6 pt-16">
              <OnboardingProgress n={3} />
              <div className="flex items-center justify-between mb-2">
                <button onClick={() => setStep("aesthetic")} className="flex items-center gap-1.5 text-[14px] font-extrabold" style={{ color: "#A99FB5" }}>
                  <ArrowLeft size={18} /> Back
                </button>
                {addedCount > 0 && (
                  <button onClick={() => { setCollected({ aesthetics: picked, baseStyle: base }); setStep("account"); }}
                    className="flex items-center gap-1.5 text-[14px] font-extrabold" style={{ color: "#A99FB5" }}>
                    Next <ArrowRight size={18} />
                  </button>
                )}
              </div>
            </div>
            <div className="px-6">
              <CameraTab active compact onAdd={handleAddItem} corrections={corrections} onCorrect={onCorrect} />
            </div>
            <div className="px-6 pb-10 mt-0.5">
              {addedCount > 0 ? (
                <p className="text-[12.5px] font-bold text-center" style={{ color: "#6BA37C" }}>{plural(addedCount, "piece")} added to your closet ✓</p>
              ) : (
                <button onClick={() => { setCollected({ aesthetics: picked, baseStyle: base }); setStep("account"); }} className="w-full text-[13px] font-bold text-center" style={{ color: "#A99FB5" }}>
                  Skip for now
                </button>
              )}
            </div>
          </div>
        ) : (
          <OnboardingAccount
            onBack={() => setStep("closet")}
            onSkip={() => onDone(collected)}
            onDone={() => onDone(collected)}
            onSignInGoogle={onSignInGoogle} onSignUpEmail={onSignUpEmail} onSignInEmail={onSignInEmail} onForgotPassword={onForgotPassword}
            authError={authError} user={user}
          />
        )}
      </div>
    </div>
  );
}

function OnboardingAccount({ onBack, onSkip, onDone, onSignInGoogle, onSignUpEmail, onSignInEmail, onForgotPassword, authError, user }) {
  const [authMode, setAuthMode] = useState("signup"); // "signup" | "login"
  const [authEmail, setAuthEmail] = useState("");
  const [authPassword, setAuthPassword] = useState("");
  const [authBusy, setAuthBusy] = useState(false);
  const [resetSent, setResetSent] = useState(false);
  const [resetError, setResetError] = useState("");

  // Once sign-in/sign-up actually succeeds, `user` flips truthy — move on right away.
  useEffect(() => { if (user) onDone(); }, [user]);

  // Logging in doesn't need the "6+ characters" hint — that's only relevant
  // when a NEW password is being chosen at signup.
  const passwordOk = authMode === "signup" ? authPassword.length >= 6 : authPassword.length > 0;
  const submitEmailAuth = async () => {
    if (!authEmail.trim() || !passwordOk) return;
    setAuthBusy(true);
    try { await (authMode === "signup" ? onSignUpEmail(authEmail.trim(), authPassword) : onSignInEmail(authEmail.trim(), authPassword)); }
    finally { setAuthBusy(false); }
  };
  const handleGoogle = async () => { setAuthBusy(true); try { await onSignInGoogle(); } finally { setAuthBusy(false); } };
  const handleForgotPassword = async () => {
    if (!authEmail.trim()) { setResetError("Enter your email above first."); return; }
    setResetError(""); setAuthBusy(true);
    try { await onForgotPassword(authEmail.trim()); setResetSent(true); }
    catch (e) { setResetError("Couldn't send that — check the email and try again."); }
    finally { setAuthBusy(false); }
  };

  return (
    <div className="px-6 pt-16 pb-10">
      <OnboardingProgress n={4} />

      <button onClick={onBack} className="flex items-center gap-1.5 text-[14px] font-extrabold mb-4" style={{ color: "#A99FB5" }}>
        <ArrowLeft size={18} /> Back
      </button>

      <div className="w-20 h-20 rounded-3xl mx-auto flex items-center justify-center mb-5" style={{ background: "linear-gradient(135deg,#FBB8D2,#D6B5F0)", boxShadow: "0 12px 30px -6px #F3B6D0aa" }}>
        <Shirt size={36} color="#fff" />
      </div>

      <h1 className="text-[30px] leading-tight font-black mb-2 text-center" style={{ color: "#5A5167" }}>Never lose your fit</h1>
      <p className="text-[15px] font-semibold mb-6 text-center" style={{ color: "#A99FB5" }}>Create an account and your closet, ratings, and favorites follow you anywhere.</p>

      <div className="grid grid-cols-3 gap-2.5 mb-7">
        {[
          { label: "Cloud sync", icon: Cloud },
          { label: "Your style, saved", icon: Heart },
          { label: "Takes 10 seconds", icon: Zap },
        ].map((f, i) => {
          const p = PASTELS[i % PASTELS.length];
          const Icon = f.icon;
          return (
            <div key={f.label} className="rounded-2xl py-4 flex flex-col items-center gap-2" style={{ background: p.bg }}>
              <div className="w-10 h-10 rounded-2xl flex items-center justify-center" style={{ background: "#ffffffcc" }}>
                <Icon size={20} color={p.text} />
              </div>
              <span className="text-[11px] font-extrabold text-center px-1" style={{ color: p.text }}>{f.label}</span>
            </div>
          );
        })}
      </div>

      <div className="rounded-3xl p-5" style={{ background: "linear-gradient(160deg,#FDF1F6,#F4EEF9)" }}>
        <button onClick={handleGoogle} disabled={authBusy}
          className="w-full py-3.5 rounded-2xl font-black text-[14px] flex items-center justify-center gap-2 mb-3 disabled:opacity-50"
          style={{ background: "#fff", color: "#5A5167", border: "1.5px solid #EFE3F0" }}>
          Continue with Google
        </button>
        <div className="flex items-center gap-2 mb-3">
          <div style={{ flex: 1, height: 1, background: "#ffffff99" }} />
          <span className="text-[11px] font-bold" style={{ color: "#A99FB5" }}>or</span>
          <div style={{ flex: 1, height: 1, background: "#ffffff99" }} />
        </div>
        <input value={authEmail} onChange={(e) => setAuthEmail(e.target.value)} placeholder="Email" type="email" autoComplete="email"
          className="w-full rounded-2xl px-4 py-3.5 text-[14px] font-semibold outline-none mb-2" style={{ background: "#fff", border: "1.5px solid #EFE3F0", color: "#5A5167" }} />
        <input value={authPassword} onChange={(e) => setAuthPassword(e.target.value)} placeholder={authMode === "signup" ? "Password (6+ characters)" : "Password"} type="password"
          autoComplete={authMode === "signup" ? "new-password" : "current-password"}
          className="w-full rounded-2xl px-4 py-3.5 text-[14px] font-semibold outline-none mb-2" style={{ background: "#fff", border: "1.5px solid #EFE3F0", color: "#5A5167" }} />
        {authMode === "login" && (
          resetSent ? (
            <p className="text-[12px] font-bold text-center mb-3" style={{ color: "#6BA37C" }}>Check your email for a link to reset your password.</p>
          ) : (
            <button onClick={handleForgotPassword} disabled={authBusy} className="w-full text-[12px] font-bold text-right mb-3 disabled:opacity-50" style={{ color: "#8A7FA0" }}>
              Forgot password?
            </button>
          )
        )}
        <button onClick={submitEmailAuth} disabled={authBusy || !authEmail.trim() || !passwordOk}
          className="w-full py-3.5 rounded-2xl text-white font-black text-[14px] disabled:opacity-40 mb-2" style={{ background: "linear-gradient(135deg,#FBB8D2,#F3A7CB)" }}>
          {authMode === "signup" ? "Create Account" : "Log In"}
        </button>
        <button onClick={() => { setAuthMode((m) => m === "signup" ? "login" : "signup"); setResetSent(false); setResetError(""); }} className="w-full text-[12.5px] font-bold text-center" style={{ color: "#8A7FA0" }}>
          {authMode === "signup" ? "Already have an account? Log in" : "New here? Create an account"}
        </button>
        {authError && <p className="text-[12px] font-bold mt-2 text-center" style={{ color: "#D96A6A" }}>{authError}</p>}
        {resetError && <p className="text-[12px] font-bold mt-2 text-center" style={{ color: "#D96A6A" }}>{resetError}</p>}
      </div>

      <button onClick={onSkip} className="w-full text-[13px] font-bold text-center mt-5" style={{ color: "#A99FB5" }}>
        Skip for now
      </button>
    </div>
  );
}

/* ================= PROFILE ================= */
function ProfileTab({ aesthetics, setAesthetics, favorites, toggleFav, tryNew, setTryNew, baseStyle, setBaseStyle, feedback, styleBoard, onRate, plan, setPlan, usage, onShareBonus, onReset, showToast, user, authError, onSignInGoogle, onSignUpEmail, onSignInEmail, onForgotPassword, onSignOut, avatar, setAvatar, avatarColor, setAvatarColor }) {
  const loved = styleBoard || [];   // the actual looks rated STYLE_STARS+ — the mood board
  const [styleOpen, setStyleOpen] = useState(false);
  const [favOpen, setFavOpen] = useState(false);
  const [acctPageOpen, setAcctPageOpen] = useState(false);
  const [avatarPickerOpen, setAvatarPickerOpen] = useState(false);
  const [detail, setDetail] = useState(null);   // { outfit, pastel } — the single look opened full-size, shared by both mood boards
  const [resetConfirmOpen, setResetConfirmOpen] = useState(false);
  const toggle = (a) =>
    setAesthetics(aesthetics.includes(a) ? aesthetics.filter((x) => x !== a) : [...aesthetics, a]);
  // Avatar shown wherever the account picture appears: a custom FitCheck pick
  // wins over the Google photo, which wins over an initial-letter fallback.
  // The picked pastel background only applies behind a custom emoji pick — a
  // real Google photo or the initial-letter fallback keep a neutral backdrop.
  const avatarChoice = avatarFor(avatar);
  const avatarBg = avatarChoice ? avatarBgFor(avatarColor) : "#F6EEF6";
  const renderAvatar = (size) => avatarChoice
    ? <span style={{ fontSize: size * 0.52, lineHeight: 1 }}>{avatarChoice.emoji}</span>
    : user && user.photoURL
      ? <img src={user.photoURL} alt="" className="w-full h-full object-cover" />
      : user
        ? <span style={{ fontSize: size * 0.4 }}>{(user.displayName || user.email || "?").trim().charAt(0).toUpperCase()}</span>
        : <User size={size * 0.44} color="#8A7FA0" />;
  const avatarPicker = avatarPickerOpen && (
    <div className="fixed inset-0 z-50 flex items-end justify-center" style={{ background: "#00000066" }} onClick={() => setAvatarPickerOpen(false)}>
      <div className="w-full rounded-t-3xl p-6" style={{ maxWidth: 430, background: "#fff" }} onClick={(e) => e.stopPropagation()}>
        <div className="text-[17px] font-black text-center mb-1" style={{ color: "#5A5167" }}>Pick your profile picture</div>
        <p className="text-[12.5px] font-semibold text-center mb-4" style={{ color: "#A99FB5" }}>Just for FitCheck — pick your favorite.</p>
        <div className="grid grid-cols-4 gap-3 mb-5">
          {PROFILE_AVATARS.map((a) => {
            const on = avatar === a.id;
            return (
              <button key={a.id} onClick={() => setAvatar(a.id)}
                className="aspect-square rounded-full flex items-center justify-center text-[26px] active:scale-90 transition-transform"
                style={{ background: avatarBgFor(avatarColor), outline: on ? "2.5px solid #8E78C0" : "2.5px solid transparent" }}>
                {a.emoji}
              </button>
            );
          })}
        </div>
        <div className="text-[13px] font-black mb-2" style={{ color: "#6E6480" }}>Background color</div>
        <div className="flex gap-3 justify-center mb-5">
          {AVATAR_BG_COLORS.map((c) => {
            const on = (avatarColor || AVATAR_BG_COLORS[0].id) === c.id;
            return (
              <button key={c.id} onClick={() => setAvatarColor(c.id)}
                className="w-9 h-9 rounded-full active:scale-90 transition-transform"

  // --- My Account (real Firebase sign-in — follows you to another device) ---
  const [authMode, setAuthMode] = useState("login");   // "login" | "signup"
  const [authEmail, setAuthEmail] = useState("");
  const [authPassword, setAuthPassword] = useState("");
  const [authBusy, setAuthBusy] = useState(false);
  const [resetSent, setResetSent] = useState(false);
  const [resetError, setResetError] = useState("");
  // Logging in doesn't need the "6+ characters" hint — that's only relevant
  // when a NEW password is being chosen at signup.
  const passwordOk = authMode === "signup" ? authPassword.length >= 6 : authPassword.length > 0;
  const submitEmailAuth = async () => {
    if (!authEmail.trim() || !passwordOk) return;
    setAuthBusy(true);
    try { await (authMode === "signup" ? onSignUpEmail(authEmail.trim(), authPassword) : onSignInEmail(authEmail.trim(), authPassword)); }
    finally { setAuthBusy(false); }
  };
  const handleGoogle = async () => { setAuthBusy(true); try { await onSignInGoogle(); } finally { setAuthBusy(false); } };
  const handleForgotPassword = async () => {
    if (!authEmail.trim()) { setResetError("Enter your email above first."); return; }
    setResetError(""); setAuthBusy(true);
    try { await onForgotPassword(authEmail.trim()); setResetSent(true); }
    catch (e) { setResetError("Couldn't send that — check the email and try again."); }
    finally { setAuthBusy(false); }
  };

  // --- My Plans (local demo — no real payment is collected) ---
  const unlocked = plansUnlocked(user?.email);
  const activePlan = unlocked ? (plan || "free") : "free";   // locked to free until billing is live (or for a test account), regardless of any stored plan
  const shareBonusesToday = (usage && usage.shareBonuses) || 0;
  const shareCapped = shareBonusesToday >= MAX_SHARE_BONUSES_PER_DAY;
  const handleShare = async () => {
    const shareData = { title: "FitCheck", text: "Hey! I've been using this app called FitCheck to style my outfits — click this link to help give me more outfit generations! 💕", url: "https://royliu.github.io/fitcheck/" };
    try {
      if (navigator.share) await navigator.share(shareData);
      else if (navigator.clipboard) { await navigator.clipboard.writeText(shareData.url); }
    } catch (e) { return; }   // share sheet cancelled — no bonus for a share that didn't happen
    onShareBonus && onShareBonus();
  };

  // --- My Style — a full mood board, opened over the Profile with a back arrow ---
  if (styleOpen) {

        <h1 className="text-2xl font-black mb-1" style={{ color: "#5A5167" }}>My Style</h1>
        <p className="text-sm font-semibold mb-5" style={{ color: "#A99FB5" }}>

            {loved.map((o, i) => {

                  </div>
                </button>
              );
            })}

  // --- Favorited Outfits — same full-mood-board treatment as My Style: real

              <Heart size={28} color="#C56B96" />

            <div className="text-[15px] font-black" style={{ color: "#5A5167" }}>No favorites yet</div>

                  <OutfitCollage items={o.items} pastel={p} height={130} bg="#fff" />
                  <div className="p-2.5">
                    <div className="text-[13px] font-black leading-tight truncate" style={{ color: p.text }}>{o.title}</div>
                    <div className="text-[10.5px] font-bold mt-0.5" style={{ color: p.text + "bb" }}>{o.aesthetic}</div>
                  </div>
                </button>
              );
            })}
          </div>

          <MoodBoardDetail
            outfit={detail.outfit} pastel={detail.pastel} onClose={() => setDetail(null)}

              <button onClick={submitEmailAuth} disabled={authBusy || !authEmail.trim() || !passwordOk}

        <button onClick={() => setStyleOpen(true)}

          style={{ background: "linear-gradient(120deg,#FDE9F1,#F1ECFB)" }}>
          <div className="w-16 h-16 rounded-2xl flex items-center justify-center shrink-0" style={{ background: "#ffffffcc" }}>
            <Star size={28} color="#C56B96" />

          <div className="flex-1 min-w-0">
            <div className="text-[18px] font-black" style={{ color: "#5A5167" }}>My Style</div>
            <div className="text-[13px] font-bold" style={{ color: "#A99FB5" }}>
              {plural(loved.length, "outfit")} · {plural(aesthetics.length, "aesthetic")} · {favorites.length} saved
            </div>
          </div>
          <ArrowRight size={20} color="#C99BB5" />
        </button>

        <button onClick={() => setFavOpen(true)}
          className="w-full text-left rounded-3xl p-5 flex items-center gap-4 active:scale-[0.99] transition-transform"
          style={{ background: "linear-gradient(120deg,#FDE9F1,#F1ECFB)" }}>
          <div className="w-16 h-16 rounded-2xl flex items-center justify-center shrink-0" style={{ background: "#ffffffcc" }}>
            <Heart size={26} color="#C56B96" fill={favorites.length ? "#C56B96" : "none"} />
          </div>
          <div className="flex-1 min-w-0">
            <div className="text-[18px] font-black" style={{ color: "#5A5167" }}>Favorited Outfits</div>
            <div className="text-[13px] font-bold" style={{ color: "#A99FB5" }}>
              {favorites.length > 0 ? `${plural(favorites.length, "look")} saved` : "Tap the heart on a look, or rate it 5★"}
            </div>
          </div>
          <ArrowRight size={20} color="#C99BB5" />
        </button>

        {avatarPicker}
      </div>
    );
  }

  return (
    <div className="pb-28">
      <h1 className="text-[34px] leading-tight font-black mb-5" style={{ color: "#5A5167" }}>Profile</h1>

      {/* My Account — tap the picture to change your avatar; tap the rest of
          the bar to open the Account page (sign-in details, My Style,
          Favorited Outfits). */}
      <label className="text-[19px] font-black tracking-wide block mb-2" style={{ color: "#6E6480" }}>My Account</label>
      <div className="w-full rounded-3xl p-4 mb-6 flex items-center gap-3"
        style={{ background: user ? "linear-gradient(120deg,#E6F0FB,#F1ECFB)" : "#F6EEF6" }}>
        <button onClick={() => setAvatarPickerOpen(true)}
          className="w-12 h-12 rounded-full overflow-hidden flex items-center justify-center shrink-0 active:scale-90 transition-transform" style={{ background: avatarBg }}>
          {renderAvatar(48)}
        </button>
        <button onClick={() => setAcctPageOpen(true)} className="flex-1 min-w-0 flex items-center gap-3 text-left active:opacity-70 transition-opacity">
          <div className="flex-1 min-w-0">
            <div className="text-[15px] font-black truncate" style={{ color: "#5A5167" }}>{user ? (user.displayName || user.email) : "Not signed in"}</div>
            <div className="text-[12px] font-bold" style={{ color: "#A99FB5" }}>{user ? "Signed in · synced to your account" : "Sign in to sync your closet across devices"}</div>
          </div>
          <ArrowRight size={20} color="#C99BB5" />
        </button>
      </div>
      {avatarPicker}

      {/* My Plans — payment isn't wired up yet, so every account is locked to
          Starter Pack. Paid tiers are shown (for the pitch) but disabled. */}
      <label className="text-[19px] font-black tracking-wide block mb-1" style={{ color: "#6E6480" }}>My Plans</label>
      <p className="text-[12.5px] font-semibold mb-3" style={{ color: "#B8AFC6" }}>
        {unlocked ? "Picking a plan unlocks its daily generation limit." : "Paid plans are coming soon — for now every account is on Starter Pack."}
      </p>
      <div className="space-y-2.5 mb-4">
        {PLANS.map((p) => {
          const locked = !unlocked && p.key !== "free";
          const on = activePlan === p.key;
          return (
            <button key={p.key}
              onClick={() => locked ? showToast("Payment isn't set up yet — you're on Starter Pack for now") : setPlan(p.key)}
              className="w-full text-left rounded-2xl p-4 flex items-center gap-3 transition-transform"
              style={{ background: on ? "#FDE9F1" : "#fff", border: on ? "2px solid #F3A7CB" : "2px solid #F1E6F1", opacity: locked ? 0.55 : 1 }}>
              <div className="w-8 h-8 rounded-full flex items-center justify-center shrink-0" style={{ background: on ? "#F3A7CB" : "transparent", border: on ? "none" : "2px solid #DDD0E6" }}>
                {on ? <Check size={16} color="#fff" /> : locked ? <Lock size={13} color="#C6BCD2" /> : null}
              </div>
