        Restart FitCheck
      </button>
      <p className="text-[11.5px] font-semibold mt-2 mb-2 text-center leading-relaxed" style={{ color: "#C6BCD2" }}>
        Erases your closet, ratings, favorites, and preferences — back to a brand-new install.
      </p>

      {resetConfirmOpen && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-6" style={{ background: "#00000066" }} onClick={() => setResetConfirmOpen(false)}>
          <div className="w-full rounded-3xl p-6" style={{ maxWidth: 360, background: "#fff" }} onClick={(e) => e.stopPropagation()}>
            <div className="w-14 h-14 rounded-2xl mx-auto flex items-center justify-center mb-4" style={{ background: "#FCEDE6" }}>
              <RotateCcw size={24} color="#CC8567" />
            </div>
            <div className="text-[18px] font-black text-center mb-2" style={{ color: "#5A5167" }}>{user ? "Restart FitCheck?" : "Reset all your data?"}</div>
            <p className="text-[13.5px] font-semibold text-center leading-relaxed mb-5" style={{ color: "#A99FB5" }}>
              {user
                ? "This signs you out and clears FitCheck on this device, starting fresh like the very first time. Your closet, ratings, and preferences stay saved in your account — sign back in anytime to restore them."
                : "This erases your closet, ratings, favorites, and preferences and starts FitCheck fresh, like the very first time you opened it. This can't be undone."}
            </p>
            <div className="flex gap-2.5">
              <button onClick={() => setResetConfirmOpen(false)}
                className="flex-1 py-3.5 rounded-2xl font-black text-[14px]" style={{ background: "#F4EEF5", color: "#8A7FA0" }}>
                Cancel
              </button>
              <button onClick={() => onReset && onReset()}
                className="flex-1 py-3.5 rounded-2xl font-black text-[14px] text-white" style={{ background: "#D96A6A" }}>
                Yes, Reset
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ================= ROOT ================= */
const defaultPrefs = () => ({ aesthetics: [], closetPhoto: null, baseStyle: "Cali", tryNew: false, feedback: emptyFeedback(), styleBoard: [], plan: "free", usage: null, account: null, avatar: null, avatarColor: null });

/* Polls this SAME page's own URL (no server endpoint needed) for a newer
   APP_VERSION stamp, so a tab left open across a deploy can prompt a refresh. */
function useUpdateChecker(){
  const [updateAvailable, setUpdateAvailable] = useState(false);
  useEffect(() => {
    let cancelled = false;
    const check = async () => {
      try {
        const sep = location.pathname.includes("?") ? "&" : "?";
        const res = await fetch(location.pathname + sep + "_v=" + Date.now(), { cache: "no-store" });
        if (!res.ok) return;
        const text = await res.text();
        const m = text.match(/const APP_VERSION\s*=\s*"([^"]+)"/);
        if (!cancelled && m && m[1] && m[1] !== APP_VERSION) setUpdateAvailable(true);
      } catch (e) { /* offline, or blocked — just skip this check */ }
    };
    const firstCheck = setTimeout(check, 30000);            // avoid racing a deploy in progress right at load
    const id = setInterval(check, 3 * 60 * 1000);           // poll every 3 min
    const onVisible = () => { if (document.visibilityState === "visible") check(); };
    document.addEventListener("visibilitychange", onVisible);
    return () => { cancelled = true; clearTimeout(firstCheck); clearInterval(id); document.removeEventListener("visibilitychange", onVisible); };
  }, []);
  return updateAvailable;
}

function App() {
  const [hydrated, setHydrated] = useState(false);   // loaded saved state from IndexedDB yet?
  const [onboarded, setOnboarded] = useState(false);
  const [prefs, setPrefs] = useState(defaultPrefs);
  const [tab, setTab] = useState("stylist");
  const [weather, setWeather] = useState(null);
  const [closet, setCloset] = useState(SEED);
  const [trash, setTrash] = useState(SEED_TRASH);
  const [favorites, setFavorites] = useState([]);
  const [toast, setToast] = useState("");
  const updateAvailable = useUpdateChecker();

  // --- Cloud account (Firebase) ---
  const [user, setUser] = useState(null);            // signed-in Firebase user, or null
  const [authChecked, setAuthChecked] = useState(false);  // has Firebase told us the initial sign-in state yet?
  const [cloudReady, setCloudReady] = useState(false);    // finished this session's pull-or-push reconciliation?
  const [authError, setAuthError] = useState("");
  // Which item ids existed in each cloud sub-collection as of the last sync —
  // lets syncCloudCollection() know what got deleted locally since then.
  const cloudIdsRef = useRef({ closet: new Set(), trash: new Set(), favorites: new Set(), styleBoard: new Set() });

  // Load saved state from IndexedDB once (falling back to a one-time migration of
  // the old localStorage build), then start persisting changes.
  useEffect(() => {
    (async () => {
      let saved = await idbGet(STATE_KEY);
      if (!saved) {
        const legacy = loadLegacyState();
        if (legacy) { saved = legacy; idbSet(STATE_KEY, legacy); try { localStorage.removeItem(STATE_LS); } catch (e) {} }
      }
      if (saved) {
        setOnboarded(!!saved.onboarded);
        if (saved.prefs) setPrefs({ ...defaultPrefs(), ...saved.prefs });
        // One-time repair: closets saved before the uid() fix could contain two
        // items sharing the same id (a per-session counter restarting at 0 every
        // reload) — that collision is what made tapping one closet item sometimes
        // open a different one. Reassign a fresh unique id to any duplicate found.
        const dedupe = (arr) => {
          if (!arr) return arr;
          const seen = new Set(); let changed = false;
          const out = arr.map((it) => {
            if (it && it.id && seen.has(it.id)) { changed = true; return { ...it, id: uid() }; }
            if (it && it.id) seen.add(it.id);
            return it;
          });
          return changed ? out : arr;
        };
        if (saved.closet) setCloset(dedupe(saved.closet));
        if (saved.trash) setTrash(dedupe(saved.trash));
        if (saved.favorites) setFavorites(saved.favorites);
      }
      setHydrated(true);
    })();
  }, []);

  // Track Firebase's own sign-in state (persists across reloads on its own).
  useEffect(() => {
    const unsub = onAuthStateChanged(auth, (u) => { setUser(u); setAuthChecked(true); });
    return unsub;
  }, []);

  // Once we know BOTH what's saved locally and whether we're signed in, decide
  // which way data flows: an EXISTING account's cloud data wins (so a second
  // device picks up what the first one has); a brand-new account instead gets
  // this device's current (possibly guest) data pushed up as its starting point.
  useEffect(() => {
    if (!hydrated || !authChecked) return;
    if (!user) { setCloudReady(false); return; }
    let cancelled = false;
    (async () => {
      try {
        const cloud = await pullCloudState(user.uid);
        if (cancelled) return;
        if (cloud.exists) {
          setOnboarded(true);
          // Preferences come from the account (its baseStyle Cali/Korean, plan,
          // ratings, etc. are the source of truth) — EXCEPT aesthetics, which we
          // UNION with whatever the guest just picked. So an account set to
          // "streetwear" + a guest who picked "minimalist" ends up with both,
          // not one clobbering the other. (Deduped; the debounced push below
          // then saves the combined set back to the account.)
          const mergedAesthetics = Array.from(new Set([...(cloud.prefs.aesthetics || []), ...(prefs.aesthetics || [])]));
          setPrefs({ ...defaultPrefs(), ...cloud.prefs, aesthetics: mergedAesthetics });
          // MERGE, don't overwrite. Anything added while signed out — most
          // importantly the photo(s) taken during onboarding before logging in —
          // lives in the local (guest) collections right now. If we just replaced
          // them with the cloud copy, those guest items would silently vanish the
          // instant an existing account's data loaded (exactly the reported bug).
          // So union by id: the account's cloud items are the base, and any local
          // item whose id isn't already up there is a guest addition we keep. The
          // debounced push effect below then uploads those extras to the account
          // (cloudIdsRef is seeded with the ORIGINAL cloud ids, so the sync sees
          // the extras as new and adds them — while deleting nothing).
          const mergeById = (cloudArr, localArr) => {
            const have = new Set((cloudArr || []).map((i) => i.id));
            const extras = (localArr || []).filter((i) => i && i.id && !have.has(i.id));
            return [...extras, ...(cloudArr || [])];
          };
          setCloset(mergeById(cloud.closet, closet));
          setTrash(mergeById(cloud.trash, trash));
          setFavorites(mergeById(cloud.favorites, favorites));
          cloudIdsRef.current = {
            closet: new Set(cloud.closet.map((i) => i.id)),
            trash: new Set(cloud.trash.map((i) => i.id)),
            favorites: new Set(cloud.favorites.map((i) => i.id)),
            styleBoard: new Set((cloud.prefs.styleBoard || []).map((i) => i.id)),
          };
        } else {
          // Brand-new account — upload whatever's on this device right now.
          await pushCloudMain(user.uid, prefs, onboarded);
          const results = await Promise.all(CLOUD_SUBCOLLECTIONS.map((name) =>
            syncCloudCollection(user.uid, name, name === "styleBoard" ? prefs.styleBoard : { closet, trash, favorites }[name], new Set())));
          cloudIdsRef.current = Object.fromEntries(CLOUD_SUBCOLLECTIONS.map((name, i) => [name, results[i]]));
        }
        if (!cancelled) setCloudReady(true);
      } catch (e) {
        if (!cancelled) { setAuthError("Couldn't reach your account data — you're still safe on this device."); setCloudReady(true); }
      }
    })();
    return () => { cancelled = true; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [hydrated, authChecked, user]);

  // While signed in, push local changes up to the cloud (debounced), so a
  // second device sees them too. Never fires until the initial pull/push above
  // has finished, so we don't overwrite fresh cloud data with stale local data.
  useEffect(() => {
    if (!cloudReady || !user) return;
    const t = setTimeout(async () => {
      try {
        await pushCloudMain(user.uid, prefs, onboarded);
        const byName = { closet, trash, favorites, styleBoard: prefs.styleBoard || [] };
        const results = await Promise.all(CLOUD_SUBCOLLECTIONS.map((name) =>
          syncCloudCollection(user.uid, name, byName[name], cloudIdsRef.current[name])));
        cloudIdsRef.current = Object.fromEntries(CLOUD_SUBCOLLECTIONS.map((name, i) => [name, results[i]]));
      } catch (e) { /* offline or blocked — local IndexedDB copy still has everything */ }
    }, 800);
    return () => clearTimeout(t);
  }, [cloudReady, user, onboarded, prefs, closet, trash, favorites]);

  // --- Sign in / up / out ---
  const signInGoogle = async () => {
    setAuthError("");
    try { await signInWithPopup(auth, googleProvider); }
    catch (e) { setAuthError(e && e.code === "auth/popup-closed-by-user" ? "" : "Couldn't sign in with Google — try again."); }
  };
  const signUpEmail = async (email, password) => {
    setAuthError("");
    try { await createUserWithEmailAndPassword(auth, email, password); }
    catch (e) { setAuthError(friendlyAuthError(e)); }
  };
  const signInEmail = async (email, password) => {
    setAuthError("");
    try { await signInWithEmailAndPassword(auth, email, password); }
    catch (e) { setAuthError(friendlyAuthError(e)); }
  };
  const signOutUser = async () => { try { await signOut(auth); } catch (e) {} };
  // Firebase's native flow: an emailed reset LINK, not a code — there's no
  // backend here to generate/verify a custom 6-digit code. Silently swallow
  // "no account for this email" so the response doesn't reveal whether an
  // email is registered (standard practice against account enumeration).
  const sendPasswordReset = async (email) => {
    try { await sendPasswordResetEmail(auth, email); }
    catch (e) { if (!e || e.code !== "auth/user-not-found") throw e; }
  };

  // Persist wardrobe + learning whenever they change (after the initial load, so
  // we never overwrite saved data with the starting defaults).
  useEffect(() => {
    if (!hydrated) return;
    const t = setTimeout(() => { idbSet(STATE_KEY, { onboarded, prefs, closet, trash, favorites }); }, 300);
    return () => clearTimeout(t);
  }, [hydrated, onboarded, prefs, closet, trash, favorites]);

  // Record a star rating: update aesthetic + item scores, and promote the look's
  // aesthetic into the user's style once it's rated STYLE_STARS or higher.
  const rateOutfit = (outfit, stars) => {
    const a = bareAesthetic(outfit.aesthetic);
    const ids = (outfit.items || []).map((i) => i.id);
    let promoted = false;
    setPrefs((p) => {
      const fb = p.feedback || emptyFeedback();
      const prev = fb.ratings[outfit.id];
      const w = (s) => s - 3;                 // 4–5 ⇒ positive, 1–2 ⇒ negative
      const undo = prev ? w(prev) : 0;
      const aesthetic = { ...fb.aesthetic }, item = { ...fb.item };
      if (a) aesthetic[a] = (aesthetic[a] || 0) - undo + w(stars);
      ids.forEach((id) => { item[id] = (item[id] || 0) - undo * 0.5 + w(stars) * 0.5; });
      let aesthetics = p.aesthetics;
      if (stars >= STYLE_STARS && a && AESTHETICS.includes(a) && !aesthetics.includes(a)) {
        aesthetics = [...aesthetics, a]; promoted = true;
      }
      // Keep an actual gallery of the looks the user loved (STYLE_STARS+), for the
      // My Style mood board — a downgrade below the threshold removes it again.
      const prevBoard = p.styleBoard || [];
      const { pastel, ...cleanOutfit } = outfit;   // drop the transient render-only field
      const styleBoard = stars >= STYLE_STARS
        ? [{ ...cleanOutfit, rating: stars }, ...prevBoard.filter((o) => o.id !== outfit.id)].slice(0, 30)
        : prevBoard.filter((o) => o.id !== outfit.id);
      return { ...p, aesthetics, styleBoard, feedback: { ...fb, ratings: { ...fb.ratings, [outfit.id]: stars }, aesthetic, item } };
    });
    showToast(promoted ? `${a} added to your style ★` : "Thanks — learning your taste");
    // A perfect 5★ rating automatically favorites the look too.
    if (stars === 5 && !favorites.some((f) => f.id === outfit.id)) toggleFav(outfit);
  };

  // Remember a manual category fix (keyed by garment type) so the same correction
  // is auto-applied to that type on every future scan.
  const recordCorrection = (noun, category, subcategory) => {
    const key = (noun || "").toLowerCase().trim();
    if (!key) return;
    setPrefs((p) => {
      const fb = p.feedback || emptyFeedback();
      return { ...p, feedback: { ...fb, corrections: { ...(fb.corrections || {}), [key]: { category, subcategory: subcategory || null } } } };
    });
  };

  // Swipe-away = a soft downvote for that look's aesthetic + items.
  const dismissOutfit = (outfit) => {
    const a = bareAesthetic(outfit.aesthetic);
    const ids = (outfit.items || []).map((i) => i.id);
    setPrefs((p) => {
      const fb = p.feedback || emptyFeedback();
      const aesthetic = { ...fb.aesthetic }, item = { ...fb.item };
      if (a) aesthetic[a] = (aesthetic[a] || 0) - 1;
      ids.forEach((id) => { item[id] = (item[id] || 0) - 0.5; });
      return { ...p, feedback: { ...fb, aesthetic, item } };
    });
  };

  const toggleFav = (outfit) => {
    setFavorites((prev) => {
      if (prev.some((f) => f.id === outfit.id)) {
        return prev.filter((f) => f.id !== outfit.id);
      }
      showToast(`${outfit.title} saved to favorites`);
      // store a clean copy (drop transient render fields)
      const { pastel, familiar, ...clean } = outfit;
      return [clean, ...prev];
    });
  };

  useEffect(() => {
    const id = "nunito-font";
    if (!document.getElementById(id)) {
      const l = document.createElement("link");
      l.id = id; l.rel = "stylesheet";
      l.href = "https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap";
      document.head.appendChild(l);
    }
    const s = document.createElement("style");
    s.textContent = `@keyframes scan{0%{top:0}100%{top:100%}}`;
    document.head.appendChild(s);

    // Pull the real local weather (asks for location; falls back to IP).
    fetchWeather().then((w) => { if (w) setWeather(w); }).catch(() => {});
  }, []);

  // If a scan was mid-flight last time the app closed (a crash/reload, not a
  // normal finish — this survives a real page reload, unlike React state), let
  // the user know what happened instead of silently losing their photo. Gated
  // on hydrated (not fired from the plain mount effect above): hydration can
  // easily take longer than this toast's own 1200ms-delay + 1800ms-autoclear
  // window (IndexedDB + Firebase auth checks), so firing it unconditionally on
  // mount meant the whole toast could show AND disappear while still on the
  // splash screen — which never renders <Toast> — losing the message
  // entirely. Firing only once hydrated confirms we're on a screen that can
  // actually show it.
  useEffect(() => {
    if (!hydrated) return;
    const interrupted = takeInterruptedScan();
    if (interrupted) {
      setTimeout(() => showToast(`Your last scan was interrupted during "${interrupted.stage}" — please try again`), 600);
    }
  }, [hydrated]);

  // Pre-import the model LIBRARIES (just the JS, not the memory-heavy sessions)
  // the moment the app opens, even during onboarding. This is what makes the
  // first onboarding scan reliable in the standalone home-screen web app: the
  // fragile cross-origin module fetch that throws "importing a module script
  // failed" happens now, with retries + a fallback CDN, while the user is still
  // reading early screens — instead of on the critical path of their first scan.
  useEffect(() => { prewarmModelModules(); }, []);

  // Warm up ONLY the detector in the background once onboarding is done — NOT
  // the instant the app opens, and NOT both models at once. The previous version
  // ran getDetector() and getClassifier() together via Promise.allSettled, which
  // for a signed-in/returning user (onboarded=true on launch) meant the app open
  // kicked off downloading + INSTANTIATING two heavy WASM runtimes in parallel
  // (~167MB detector + ~150MB CLIP). WASM heaps don't shrink, so that's ~317MB
  // resident plus the transient double-instantiation spike — and if the user
  // tapped scan mid-warm-up, the scan's own load piled on top. That parallel
  // spike is the crash that "came back" at a loading stage once testing moved
  // from the onboarding flow (where this effect never ran) to a logged-in
  // account. Now we warm just the detector; CLIP loads lazily during the scan's
  // "Naming your pieces" step (the scan already releases the detector session
  // first), so the two heavy sessions never instantiate simultaneously.
  useEffect(() => {
    if (!hydrated || !onboarded) return;
    (async () => { try { await getDetector(); } catch (e) { /* ignore */ } })();
  }, [hydrated, onboarded]);

  const showToast = (m) => { setToast(m); setTimeout(() => setToast(""), 1800); };

  // Count generations against today's plan limit — one per OUTFIT actually
  // produced by a "Generate Outfits" run (usually 5, fewer for a sparse closet),
  // not one per button press.
  const useGeneration = (n = 1) => {
    setPrefs((p) => { const u = getUsage(p); return { ...p, usage: { ...u, count: u.count + n } }; });
  };
  // Local, honor-system referral bonus — there's no backend to confirm a friend
  // actually received the share, so this grants on a successful share action.
  const grantShareBonus = () => {
    let capped = false;
    setPrefs((p) => {
      const u = getUsage(p);
      if (u.shareBonuses >= MAX_SHARE_BONUSES_PER_DAY) { capped = true; return p; }
      return { ...p, usage: { ...u, shareBonuses: u.shareBonuses + 1 } };
    });
    showToast(capped ? "Today's share bonus is already maxed out" : `+${SHARE_BONUS} generations today — thanks for sharing!`);
  };
  const setPlan = (key) => setPrefs((p) => ({ ...p, plan: key }));

  // Restart — wipe everything (IndexedDB + the old localStorage key) and reload,
  // so the app comes back up exactly like a brand-new install.
  const handleReset = async () => {
    // Sign out first. Otherwise, for a logged-in user, the reload immediately
    // re-pulls their account (onboarded=true, closet, prefs) from the cloud and
    // drops them straight back into the main app — so wiping local data looks
    // like it did nothing. Their cloud account ISN'T deleted; signing back in
    // restores it. This makes Restart genuinely return to onboarding.
    try { await signOut(auth); } catch (e) {}
    try { localStorage.removeItem(STATE_LS); } catch (e) {}
    try {
      const req = indexedDB.deleteDatabase("fitcheck");
      req.onsuccess = () => location.reload();
      req.onerror = () => location.reload();
      req.onblocked = () => location.reload();
    } catch (e) { location.reload(); }
  };

  const addItem = (item) => {
    setCloset((c) => [item, ...c]);
    showToast(`${item.name} added to closet`);
    setTab("closet");
  };

  const TABS = [
    { key: "stylist", label: "Stylist", icon: Sparkles },
    { key: "closet", label: "Closet", icon: Shirt },
    { key: "camera", label: "Camera", icon: CameraIcon },
    { key: "profile", label: "Profile", icon: User },
  ];

  const setAesthetics = (next) => setPrefs((p) => ({ ...p, aesthetics: next }));
  const setTryNew = (v) => setPrefs((p) => ({ ...p, tryNew: v }));
  const setBaseStyle = (v) => setPrefs((p) => ({ ...p, baseStyle: v }));
  const setAvatar = (v) => setPrefs((p) => ({ ...p, avatar: v }));
  const setAvatarColor = (v) => setPrefs((p) => ({ ...p, avatarColor: v }));

  const finishOnboarding = (data) => {
    setPrefs((p) => ({ ...p, ...data }));
    setOnboarded(true);
  };

  if (!hydrated) {
    // Brief splash while we load the saved wardrobe so we don't flash onboarding.
    return (
      <div style={{ fontFamily: "'Nunito', sans-serif", background: "linear-gradient(180deg,#FDF1F6,#F1F4FC)", minHeight: "100vh" }}
        className="flex items-center justify-center">
        <Loader2 size={34} className="animate-spin" color="#E891B5" />
      </div>
    );
  }

  if (!onboarded) {
    return (
      <>
        <Onboarding onDone={finishOnboarding} onAddItem={addItem} corrections={prefs.feedback && prefs.feedback.corrections} onCorrect={recordCorrection}
          onSignInGoogle={signInGoogle} onSignUpEmail={signUpEmail} onSignInEmail={signInEmail} onForgotPassword={sendPasswordReset} authError={authError} user={user} />
        <Toast msg={toast} />
        <UpdateBanner show={updateAvailable} />
      </>
    );
  }

  return (
    <div style={{ fontFamily: "'Nunito', sans-serif", background: "linear-gradient(180deg,#FDF1F6,#F1F4FC)", minHeight: "100vh" }}>
      <div className="mx-auto relative" style={{ maxWidth: 430, minHeight: "100vh", background: "linear-gradient(180deg,#FFFCFE,#FBFAFF)" }}>
        <div className="px-5 pt-8">
          {tab === "stylist" && <StylistTab closet={closet} favorites={favorites} toggleFav={toggleFav} prefs={prefs} weather={weather} onRate={rateOutfit} onDismiss={dismissOutfit} onUseGeneration={useGeneration} goProfile={() => setTab("profile")} user={user} />}
          {tab === "closet" && (
            <ClosetTab closet={closet} setCloset={setCloset} trash={trash} setTrash={setTrash} goCamera={() => setTab("camera")} />
          )}
          {/* Camera stays mounted (just hidden) so a taken photo + AI loading aren't lost when you switch tabs. */}
          <div style={{ display: tab === "camera" ? "block" : "none" }}>
            <CameraTab onAdd={addItem} active={tab === "camera"} corrections={prefs.feedback && prefs.feedback.corrections} onCorrect={recordCorrection} />
          </div>
          {tab === "profile" && (
            <ProfileTab aesthetics={prefs.aesthetics} setAesthetics={setAesthetics} favorites={favorites} toggleFav={toggleFav} tryNew={prefs.tryNew} setTryNew={setTryNew} baseStyle={prefs.baseStyle} setBaseStyle={setBaseStyle} feedback={prefs.feedback} styleBoard={prefs.styleBoard} onRate={rateOutfit} plan={prefs.plan} setPlan={setPlan} usage={getUsage(prefs)} onShareBonus={grantShareBonus} onReset={handleReset} showToast={showToast}
              user={user} authError={authError} onSignInGoogle={signInGoogle} onSignUpEmail={signUpEmail} onSignInEmail={signInEmail} onForgotPassword={sendPasswordReset} onSignOut={signOutUser} avatar={prefs.avatar} setAvatar={setAvatar} avatarColor={prefs.avatarColor} setAvatarColor={setAvatarColor} />
          )}
        </div>

        <Toast msg={toast} />
        <UpdateBanner show={updateAvailable} />

        {/* Bottom nav */}
        <div className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full" style={{ maxWidth: 430 }}>
          <div className="flex justify-around items-center px-2 py-3 mx-3 mb-3 rounded-3xl"
            style={{ background: "#fff", border: "1.5px solid #F1E6F1", boxShadow: "0 -2px 20px -8px #00000018" }}>
            {TABS.map((t) => {
              const Icon = t.icon;
              const active = tab === t.key;
              return (
                <button key={t.key} onClick={() => setTab(t.key)}
                  className="flex flex-col items-center gap-1 px-3.5 py-1 rounded-2xl transition-all"
                  style={{ background: active ? "#FDE9F1" : "transparent" }}>
                  <Icon size={22} color={active ? "#E891B5" : "#C6BCD2"} fill={active && t.key === "stylist" ? "#E891B5" : "none"} />
                  <span className="text-[11px] font-extrabold" style={{ color: active ? "#E891B5" : "#C6BCD2" }}>{t.label}</span>
                </button>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}


/* Safety net: a render-time error anywhere in the tree (rather than crashing to
   a blank/broken page and possibly losing a pending scan) shows a recoverable
   "Try Again" screen instead. */
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { hasError: false }; }
  static getDerivedStateFromError() { return { hasError: true }; }
  componentDidCatch(error) { console.error("FitCheck render error:", error); }
  render() {
    if (this.state.hasError) {
      return (
        <div style={{ fontFamily: "'Nunito', sans-serif", background: "linear-gradient(180deg,#FDF1F6,#F1F4FC)", minHeight: "100vh" }}
          className="flex items-center justify-center px-6">
          <div className="text-center">
            <div className="text-[20px] font-black mb-2" style={{ color: "#5A5167" }}>Something went wrong</div>
            <p className="text-[14px] font-semibold mb-5" style={{ color: "#A99FB5" }}>Sorry about that — your data is safe. Let's try again.</p>
            <button onClick={() => this.setState({ hasError: false })}
              className="px-6 py-3.5 rounded-2xl font-black text-white text-[15px]" style={{ background: "linear-gradient(135deg,#FBB8D2,#F3A7CB)" }}>
              Try Again
            </button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

const loadingEl = document.getElementById("loading");
if (loadingEl) loadingEl.remove();
createRoot(document.getElementById("root")).render(<ErrorBoundary><App /></ErrorBoundary>);

</script>
</body>
