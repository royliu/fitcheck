/* ================= REAL CLOTHING DETECTION (in-browser, onnxruntime-web) =================
   Fashion object detector: yainage90/fashion-object-detection (Conditional DETR),
   converted to ONNX (int8 ~44MB), run fully in the browser via onnxruntime-web.
   Detects whole garments as objects -> works on worn outfits AND items laid out /
   held up / partially occluded (no full-body shot required). */
// The 167MB model is split into <100MB parts (GitHub's per-file limit) and
// stitched back together at load time.
const DETECTOR_PARTS = ["./fashion-detector.onnx.part0", "./fashion-detector.onnx.part1"];
const DETECTOR_TOTAL = 103009465;
const DETECTOR_URL = (typeof window !== "undefined" && window.FITCHECK_MODEL_URL) || "./fashion-detector.onnx";
const DET_LABELS = ["bag", "bottom", "dress", "hat", "outer", "shoes", "top"];

};
const DET_MEAN = [0.485, 0.456, 0.406], DET_STD = [0.229, 0.224, 0.225];

// --- model-load progress (so the scan screen can show a real % bar) ---
let _dlDet = 0, _dlClip = 0, _dlSeg = 0;
const _mpSubs = new Set();
// Segmentation's own progress only counts toward the bar while it's actually
// enabled — otherwise _dlSeg never leaves 0 and the bar could never reach 100%.
function modelProgress(){ return SEGMENTATION_ENABLED ? (0.5 * _dlDet + 0.2 * _dlClip + 0.3 * _dlSeg) : (0.65 * _dlDet + 0.35 * _dlClip); }
function emitModelProgress(){ const p = modelProgress(); _mpSubs.forEach((f) => f(p)); }
function onModelProgress(fn){ _mpSubs.add(fn); fn(modelProgress()); return () => _mpSubs.delete(fn); }

/* Import an ES module, trying several sources in order (the importmap's primary
   specifier first, then explicit fallback CDNs), each with a couple of quick
   retries. This is the fix for "importing a module script failed" in the iOS
   home-screen web app: that install runs in its OWN cold, sandboxed cache and is
   stricter about cross-origin module fetches, so a single CDN hiccup on esm.sh
   would hard-fail the whole scan with no recovery. If EVERY source fails we throw
   a tagged error the UI turns into a friendly "check your connection" message. */
async function importWithFallback(sources){
  let lastErr=null;
  for(const src of sources){
    for(let attempt=0; attempt<2; attempt++){
      try{ return await import(src); }
      catch(e){ lastErr=e; await new Promise((r)=>setTimeout(r, 350*(attempt+1))); }
    }
  }
  const err=new Error("MODEL_LOAD_FAILED"); err.isModelLoad=true; err.cause=lastErr; throw err;
}
let _ort = null, _ortSession = null, _ortLoadPromise = null;
/* Load (and cache) the onnxruntime-web MODULE only — not a session. Cheap enough
   (a few MB of JS, no model weights) to run at launch even on a phone. */
async function loadOrt(onStage){
  if(_ort) return _ort;
  onStage && onStage("Loading AI model…");
  _ort = await importWithFallback(["onnxruntime-web","https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/+esm"]);
  try{ _ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/"; }catch(e){}
  return _ort;
}
/* The app warms this up silently in the background the moment it opens, AND a
   real scan calls this too. Without a guard, taking a photo quickly (e.g. during
   onboarding) races the background warm-up: both calls see "not loaded yet" and
   each starts its OWN parallel 167MB download + WASM session — doubling network,
   memory and CPU load at exactly the worst moment. This makes every caller
   after the first just await the SAME in-flight load instead. */
async function getDetector(onStage) {
  if (_ortSession) return _ortSession;
  if (_ortLoadPromise) return _ortLoadPromise;
  _ortLoadPromise = (async () => {
    await loadOrt(onStage);
    onStage && onStage("Loading AI model…");
    let buf = null;
    try {
      // Stream both parts DIRECTLY into one pre-sized buffer (the exact total is
      // known). The old path held an array of every chunk AND a separate
      // concatenated copy — that extra ~100MB, stacked under the parsed session
      // InferenceSession.create builds, was a big slice of the cold-load memory
      // spike that reloads the tab mid-scan on a phone.
      const u8 = new Uint8Array(DETECTOR_TOTAL); let off = 0;
      const put = (v) => {
        if (off + v.length > u8.length) throw new Error("detector size overflow");
        u8.set(v, off); off += v.length;
        _dlDet = Math.min(1, off / DETECTOR_TOTAL); emitModelProgress();
      };
      for (const url of DETECTOR_PARTS) {
        const resp = await fetch(url);
        if (resp.body && resp.body.getReader) {
          const reader = resp.body.getReader();
          for (;;) { const { done, value } = await reader.read(); if (done) break; put(value); }
        } else {
          put(new Uint8Array(await resp.arrayBuffer()));
        }
      }
      if (off !== DETECTOR_TOTAL) throw new Error("detector size mismatch");
      buf = u8.buffer;
      _dlDet = 1; emitModelProgress();
    } catch (e) { buf = null; }
    _ortSession = await _ort.InferenceSession.create(buf || DETECTOR_URL, { executionProviders: ["wasm"] });
    _dlDet = 1; emitModelProgress();
    return _ortSession;
  })();
  try { return await _ortLoadPromise; } finally { _ortLoadPromise = null; }
}
// Detector, segmentation parser, and CLIP classifier are three separate WASM
// models — kept "warm" (all three resident for the rest of the scan) that's
// a lot of simultaneous memory on a phone, and matches where crashes were
// being reported (mid/late in a scan, once all three had loaded). Each is now
// released the moment its OWN stage is done, so at most one is resident at a
// time instead of an ever-growing pile. Trade-off: every subsequent photo in
// the same session reloads all three from scratch instead of reusing warm
// sessions — slower repeat scans, but a scan that doesn't crash beats a fast
// one that does.
async function releaseDetector(){ try{ if(_ortSession&&_ortSession.release) await _ortSession.release(); }catch(e){} _ortSession=null; }

function sigmoid(x) { return 1 / (1 + Math.exp(-x)); }
function iou(a, b) {
  const x1 = Math.max(a[0], b[0]), y1 = Math.max(a[1], b[1]), x2 = Math.min(a[2], b[2]), y2 = Math.min(a[3], b[3]);
  const inter = Math.max(0, x2 - x1) * Math.max(0, y2 - y1);
  const ua = (a[2]-a[0])*(a[3]-a[1]) + (b[2]-b[0])*(b[3]-b[1]) - inter;
  return ua > 0 ? inter / ua : 0;
}

/* --- detailed garment labelling (CLIP zero-shot; optional 2nd model) --- */
const DETAIL_CANDIDATES = {
  top:["t-shirt","tank top","crop top","blouse","button-up shirt","henley shirt","knit sweater","hoodie","sweatshirt","cardigan","polo shirt","camisole","turtleneck"],
  bottom:["denim jeans","skinny jeans","wide-leg jeans","trousers","leggings","sweatpants","cargo pants","mini skirt","midi skirt","pleated skirt","denim shorts","shorts"],
  dress:["mini dress","midi dress","maxi dress","slip dress","shirt dress","sundress","knit dress","bodycon dress"],
  outer:["denim jacket","leather jacket","blazer","bomber jacket","puffer jacket","trench coat","wool coat","cardigan","windbreaker"],
  // Footwear candidates are [clipPhrase, displayNoun] pairs: CLIP scores the
  // grammatical phrase ("a photo of a pair of sneakers"), but we store the short
  // noun. The old bare-plural candidates ("a photo of a sneakers") embedded
  // poorly and blurred shoe-vs-shoe and shoe-vs-sock discrimination.
  shoes:[["pair of sneakers","Sneakers"],["pair of boots","Boots"],["pair of ankle boots","Ankle Boots"],["pair of high heels","Heels"],["pair of sandals","Sandals"],["pair of loafers","Loafers"],["pair of ballet flats","Ballet Flats"],["pair of mary jane shoes","Mary Janes"],["pair of mules","Mules"],["pair of socks","Socks"]],
  bag:["shoulder bag","tote bag","crossbody bag","backpack","clutch","handbag","mini bag"],
  hat:["beanie","baseball cap","bucket hat","beret","wide-brim hat"],
};
/* Layering pieces that should live in Outerwear even when the detector boxed them
   as a "top". */
const OUTER_TYPES = new Set(["hoodie","sweatshirt","knit sweater","sweater","cardigan"]);
/* Casual bulky layers that look wrong thrown over a dress (a skirt+top combo is
   fine with these — only dresses are restricted). Cardigans/blazers/coats are
   NOT included here since those pair fine over a dress. */
const CASUAL_LAYER_RE = /hoodie|sweatshirt|sweater/i;
let _clipMod=null,_clip=null,_clipLoadPromise=null;
/* Load (and cache) the transformers.js MODULE only — not a pipeline. Cheap
   (JS bundle, no model weights), so it's safe to prewarm at launch on a phone;
   the memory-heavy pipeline() stays deferred to scan time. Uses the same
   fallback-CDN import as the detector so a flaky esm.sh doesn't dead-end. */
async function loadTransformers(onStage){
  if(_clipMod) return _clipMod;
  onStage && onStage("Loading detail model…");
  _clipMod = await importWithFallback(["@huggingface/transformers","https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.3.3/+esm"]);
  try{ _clipMod.env.allowLocalModels=false; }catch(e){}
  return _clipMod;
}
// Same race guard as getDetector() — the background warm-up and an actual scan
// can both call this before either has finished, doubling the load.
async function getClassifier(onStage){
  if(_clip) return _clip;
  if(_clipLoadPromise) return _clipLoadPromise;
  _clipLoadPromise=(async()=>{
    await loadTransformers(onStage);
    // dtype:"q8" — load the 8-bit QUANTIZED CLIP weights (~150MB) instead of
    // transformers.js v3's default full-precision fp32 (~600MB). That 4x cut is
    // the difference between a phone surviving this stage and not: this is a
    // SECOND WASM runtime whose heap stacks on top of the detector's (WASM heaps
    // never shrink back to the OS, so releasing the detector session doesn't
    // hand the memory back), and full-precision CLIP alone was enough to push a
    // real phone's Safari tab over its limit and reload it — the crash simply
    // moved here from "Polishing photos" once segmentation was disabled, because
    // this became the first heavy second-model to load. q8 keeps the detailed
    // garment naming working while making its memory footprint phone-safe. */
    _clip=await _clipMod.pipeline("zero-shot-image-classification","Xenova/clip-vit-base-patch32",{
      dtype:"q8",
      progress_callback:(x)=>{ if(x&&x.status==="progress"&&x.total){ _dlClip=Math.min(1,(x.loaded||0)/x.total); emitModelProgress(); } },
    });
    _dlClip=1; emitModelProgress();
    return _clip;
  })();
  try{ return await _clipLoadPromise; } finally { _clipLoadPromise=null; }
}
async function releaseClassifier(){ try{ if(_clip&&_clip.dispose) await _clip.dispose(); }catch(e){} _clip=null; }
/* Pre-IMPORT both model libraries at launch — NOT their sessions/pipelines. The
   cross-origin module fetch is the exact thing that throws "importing a module
   script failed" in the standalone web app, so doing it up front (while the user
   is still on early screens) means it's already cached and past its retries by
   the time they scan. Crucially it does NOT create a session/pipeline, so it
   allocates only a few MB of JS — safe to run during onboarding on a phone,
   unlike the ~170MB model sessions which stay deferred. Fully best-effort. */
function prewarmModelModules(){ loadOrt().catch(()=>{}); loadTransformers().catch(()=>{}); }
function titleCase(s){ return s.replace(/\b\w/g,c=>c.toUpperCase()); }
/* Refine each item's noun into a detailed garment type. Best-effort: keeps the
   coarse label if the detail model is unsure or fails to load. */
async function refineLabels(items, onStage){
  try{
    const clf=await getClassifier(onStage);
    onStage&&onStage("Naming your pieces…");
    const tmpls=["a photo of a {}","a close-up photo of a {}, a type of clothing"];
    for(const it of items){
      const cand=DETAIL_CANDIDATES[it.detLabel]; if(!cand) continue;
      // Candidates are either plain strings (the label doubles as the CLIP
      // phrase) or [clipPhrase, displayNoun] pairs (footwear). Score the phrases,
      // then map the winner back to its short noun.
      const prompts=cand.map(c=>Array.isArray(c)?c[0]:c);
      const nounFor=(p)=>{ const m=cand.find(c=>Array.isArray(c)&&c[0]===p); return m?m[1]:titleCase(p); };
      const src=it.clfPhoto||it.photo;                 // flattened cutout when available
      // Ensemble a couple of prompt templates and average — steadier on lookalikes
      // like t-shirt vs polo than a single prompt.
      const agg=new Map();
      for(const t of tmpls){
        const out=await clf(src, prompts, { hypothesis_template:t });
        for(const r of out) agg.set(r.label,(agg.get(r.label)||0)+r.score);
      }
      let lbl=null,sum=-1; for(const [l,s] of agg){ if(s>sum){ sum=s; lbl=l; } }
      if(!lbl || sum/tmpls.length<=0.17) continue;
      // Socks and shoes look nearly identical to a small on-device model, and a
      // real shoe wrongly filed as "socks" (wrong CATEGORY — lands in Accessories)
      // is more annoying than a sock left labeled as a shoe (one re-pick fixes it).
      // So only accept a "socks" verdict when it CLEARLY beats the best actual
      // footwear guess (≥25% higher), not on a hair's-width margin.
      if(nounFor(lbl)==="Socks"){
        let shoeBest=0; for(const [l,s] of agg){ if(nounFor(l)!=="Socks") shoeBest=Math.max(shoeBest,s); }
        if(sum < shoeBest*1.25){
          lbl=null; let bs=-1; for(const [l,s] of agg){ if(nounFor(l)!=="Socks" && s>bs){ bs=s; lbl=l; } }
          if(!lbl) continue;
        }
      }
      const noun=nounFor(lbl);
      it.noun=noun; it.name=it.color+" "+noun;
      // Socks aren't a detector class — when the detail model confidently reads a
      // "shoes" box as socks, file it under Accessories › Socks instead of Shoes.
      if(noun==="Socks"){ it.category="Accessories"; it.subcategory="Socks"; }
      // Hoodies / sweaters / cardigans belong in Outerwear, not Tops.
      if(OUTER_TYPES.has(lbl)){ it.category="Outerwear"; it.subcategory=null; }
    }
  }catch(e){ /* keep coarse labels */ }

const COLOR_PALETTE = [
  ["Black",25,25,25],["White",245,245,245],["Gray",130,130,130],["Navy",30,40,80],
  ["Blue",50,90,200],["Light Blue",125,175,220],["Red",200,45,45],["Pink",232,150,175],

  // typical room, false for a tight crop where one saturated garment fills
  // most of the frame (a real pink coat, say). A wide gain range "corrects"
  // that real color away toward gray. Clamped tight (was 0.78-1.3) so this
  // still nudges out a mild warm/cool cast without having enough power to
  // wash out a garment's own genuine saturated color.

                             brown garment isn't destroyed by its own color)

  //    ways: a hand holding an item up (skin is a small minority), and — worse —
  //    a worn shot where the detector's box overshoots onto bare arms/chest/legs
  //    (e.g. a long tee mis-boxed as a dress), landing the sample largely on
  //    skin and reading a white shirt as "Orange". So drop skin whenever it's up
  //    to ~70% of the patch; only KEEP it when it utterly dominates (>70%),
  //    which is the signature of a genuinely skin-toned garment (tan/beige/
  //    brown/cream fabric filling the frame) rather than contamination. Verified

  const skinCount=pool.reduce((n,q)=>n+(isSkinPixel(q[0],q[1],q[2])?1:0),0);

const CAT_COLORS={Tops:"#E891B5",Bottoms:"#8E78C0",Shoes:"#6B9AC0",Outerwear:"#6BA37C",Accessories:"#C39A3E"};

  // and painting at once, on top of two already-resident WASM ML models).
  const CAP=760;
  let scale=Math.min(CAP/Math.max(sw,sh), 2.2);      // shrink oversized crops to CAP, upscale tiny ones up to 2.2x
  if(!isFinite(scale)||scale<=0) scale=1;
  const w=Math.max(1,Math.round(sw*scale)), h=Math.max(1,Math.round(sh*scale));
  const c=document.createElement("canvas"); c.width=w; c.height=h;
  const cx=c.getContext("2d"); cx.imageSmoothingEnabled=true; cx.imageSmoothingQuality="high";
  try{ cx.filter="saturate(1.07) contrast(1.05) brightness(1.02)"; }catch(_){}
  cx.drawImage(src, sx,sy,sw,sh, 0,0,w,h);
  return c.toDataURL("image/jpeg",0.95);
}

/* Detect garments in a photo. Returns {items:[{name,category,color,photo}], annotated}. */
async function detectGarments(dataUrl,onStage,corrections,fullUrl){
  const session=await getDetector(onStage);
  onStage&&onStage("Finding your pieces…");
  const img=await loadImage(dataUrl);
  const W=img.naturalWidth,H=img.naturalHeight;
  // Detection + colour run on the fast downscaled copy, but the SHOWN crops are
  // taken from the original full-resolution photo for maximum quality.
  let fullImg=img, fs=1;
  if(fullUrl && fullUrl!==dataUrl){ try{ fullImg=await loadImage(fullUrl); fs=fullImg.naturalWidth/W; }catch(e){ fullImg=img; fs=1; } }

  const {data,h,w}=preprocessForDetector(img);
  const input=new _ort.Tensor("float32",data,[1,3,h,w]);
  const feeds={}; feeds[session.inputNames[0]]=input;
  const out=await session.run(feeds);

  // logits [1,300,7], pred_boxes [1,300,4] (cxcywh, normalized)
  let logits=null,boxes=null;
  for(const n of session.outputNames){const t=out[n]; if(t.dims[2]===4) boxes=t; else logits=t;}
  const nq=logits.dims[1],nc=logits.dims[2],L=logits.data,B=boxes.data;

  let dets=[];
  for(let i=0;i<nq;i++){
    let best=-1,bj=0;
    for(let j=0;j<nc;j++){const v=sigmoid(L[i*nc+j]); if(v>best){best=v;bj=j;}}
    if(best<DET_THRESHOLD) continue;
    const cx=B[i*4],cy=B[i*4+1],bw=B[i*4+2],bh=B[i*4+3];
    const box=[Math.max(0,(cx-bw/2)*W),Math.max(0,(cy-bh/2)*H),Math.min(W,(cx+bw/2)*W),Math.min(H,(cy+bh/2)*H)];
    dets.push({score:best,label:DET_LABELS[bj],box});
  }
  dets.sort((a,b)=>b.score-a.score);
  let kept=[];
  for(const d of dets){ if(kept.every(k=>!((k.label===d.label && iou(k.box,d.box)>0.6) || iou(k.box,d.box)>0.85))) kept.push(d); }

  // A pair of shoes is two boxes — collapse them into ONE item (the union box) so
  // the closet shows a single pair, not a left and right shoe separately.
  const shoeDets=kept.filter((k)=>k.label==="shoes");
  if(shoeDets.length>1){
    const xs=shoeDets.flatMap((s)=>[s.box[0],s.box[2]]), ys=shoeDets.flatMap((s)=>[s.box[1],s.box[3]]);
    const merged={label:"shoes",score:Math.max(...shoeDets.map((s)=>s.score)),
      box:[Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)]};
    kept=kept.filter((k)=>k.label!=="shoes").concat([merged]);
  }

  const sc=document.createElement("canvas");sc.width=W;sc.height=H;
  const sx=sc.getContext("2d",{willReadFrequently:true});sx.drawImage(img,0,0,W,H);
  const items=[];
  for(const d of kept){
    const map=DET_MAP[d.label]; if(!map) continue;
    const x1=Math.round(d.box[0]),y1=Math.round(d.box[1]),x2=Math.round(d.box[2]),y2=Math.round(d.box[3]);
    const bw=Math.max(1,x2-x1),bh=Math.max(1,y2-y1);
    if(bw*bh < W*H*0.003) continue;
    const crop=document.createElement("canvas");crop.width=bw;crop.height=bh;
    crop.getContext("2d").drawImage(sc,x1,y1,bw,bh,0,0,bw,bh);
    // Sample a tight central patch and take the MEDIAN-ish dominant color
    // (robust to background bleeding in at the box edges).
    // Outerwear is often open over a darker layer — sample the side panels (where
    // the coat fabric is) instead of the center (which shows the layer beneath).
    let regions;
    if(map.category==="Outerwear"){
      regions=[[Math.round(x1+bw*0.06),Math.round(y1+bh*0.25),Math.max(1,Math.round(bw*0.20)),Math.max(1,Math.round(bh*0.50))],
               [Math.round(x1+bw*0.74),Math.round(y1+bh*0.25),Math.max(1,Math.round(bw*0.20)),Math.max(1,Math.round(bh*0.50))]];
    } else {
      regions=[[Math.round(x1+bw*0.35),Math.round(y1+bh*0.35),Math.max(1,Math.round(bw*0.30)),Math.max(1,Math.round(bh*0.30))]];
    }
    const dom=sampleDominant(sx, regions);
    const color=dom?classifyColor(dom[0],dom[1],dom[2]):"Neutral";
    const fx=Math.round(x1*fs),fy=Math.round(y1*fs),fbw=Math.max(1,Math.round(bw*fs)),fbh=Math.max(1,Math.round(bh*fs));
    items.push({name:color+" "+map.noun,category:map.category,subcategory:map.sub||null,color,noun:map.noun,detLabel:d.label,photo:enhanceCrop(fullImg,fx,fy,fbw,fbh),bbox:[x1,y1,x2,y2],area:bw*bh});
  }
  items.sort((a,b)=>b.area-a.area);
  // Detection is fully done at this point (boxes extracted into items) — free
  // its WASM memory before the next model loads instead of stacking all three.
  await releaseDetector();
  // Cut out the garment FIRST (removes background + neighbouring clothes), THEN
  // read colour and type from those clean pixels — far more accurate than the raw
  // rectangular crop, which bleeds in skin, background and adjacent garments.
  // (Disabled for now — see SEGMENTATION_ENABLED. Items keep their plain
  // enhanced crop and the dominant-color guess already sampled above.)
  if(SEGMENTATION_ENABLED) await cutoutItems(items, sc, W, H, onStage);
  await refineLabels(items,onStage);
  // Apply the user's own learned corrections (e.g. "this type is Outerwear, not
  // Tops") so a fix they made once sticks on every future scan.
  if(corrections){
    for(const it of items){
      const c=corrections[(it.noun||"").toLowerCase()];
      if(c&&c.category){ it.category=c.category; it.subcategory=c.category==="Accessories"?(c.subcategory||null):null; }
    }
  }
  const annotated=items.length?annotatePhoto(img,W,H,items):null;
  return {items:items.map(({area,bbox,detLabel,clfPhoto,...r})=>r),annotated};
}

async function downscaleDataUrl(dataUrl,max=1000){
  const img=await loadImage(dataUrl);const scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const w=Math.round(img.naturalWidth*scale),h=Math.round(img.naturalHeight*scale);
  const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
  return c.toDataURL("image/jpeg",0.9);
}

/* Build a varied, contextual stylist note: silhouette cue + layering + how it
   fits the vibe/aesthetic/occasion/weather. Rotates phrasing by outfit index so
   the five looks don't read the same. */
/* ---------- stylist notes: casual, Gen-Z-influencer voice, genuinely varied ----------
   Real randomness (Math.random — this runs live in the browser, not a build
   script) across many interchangeable fragments AND multiple sentence shapes,
   so five looks in one batch (and different batches) don't read like the same
   fill-in-the-blank template. */
const randPick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const capFirst = (s) => s.charAt(0).toUpperCase() + s.slice(1);
function joinNatural(parts){
  if(parts.length===1) return parts[0];
  return parts.slice(0,-1).join(", ") + ", and " + parts[parts.length-1];
}

/* Weather line — anchored on the outerwear piece when there is one (that's the
   real reason weather matters to an outfit), otherwise a generic temp-appropriate
   line. */
function weatherLine(w, outer){
  if(!w || w.temp==null) return null;
  const t = w.temp, cond = (w.condition||"").toLowerCase() || "mild";
  if(outer){
    const n = outer.name.toLowerCase();
    return randPick([
      `the ${t}° weather is perfect for a ${n} you can throw on open or button up depending on how you're feeling`,
      `at ${t}° out, the ${n} is the easiest layer — light enough to carry around and put on whenever you actually need it`,
      `${t}° and ${cond} means the ${n} is doing exactly what it should, on or off all day`,
      `it's ${t}° out there, and the ${n} gives you just enough warmth without committing to a full coat`,
      `${t}° is basically made for a piece like the ${n} — easy to layer, easy to lose when it warms up`,
    ]);
  }
  if(t<=45) return randPick([
    `it's a chilly ${t}° out, so this fit is built to actually keep you warm, not just look good`,
    `at ${t}°, you'll want to move fast between places — this one's warm enough to handle it`,
  ]);
  if(t<=60) return randPick([
    `${t}° and ${cond} out is that in-between weather where you don't want to overdress or underdress, and this hits the mark`,
    `it's a cool ${t}° — nothing here is too heavy or too thin for it`,
  ]);
  if(t<=78) return randPick([
    `${t}° and ${cond} is honestly the easiest weather to dress for, so this fit doesn't have to work hard`,
    `it's a solid ${t}° out — no jacket needed, just the vibe`,
  ]);
  return randPick([
    `it's heating up to ${t}°, so breathable pieces are the move here`,
    `with the heat sitting at ${t}°, this look keeps things light so you're not dying by noon`,
  ]);
}

const STYLE_TIPS = {
  dress: (d) => randPick([
    `just let the ${d} do all the work here, it's a one-and-done kind of piece`,
    `the ${d} is basically the whole outfit — everything else is just backup`,
    `no need to overthink it, the ${d} speaks for itself`,
    `the ${d} does the heavy lifting so you don't have to think past it`,
  ]),
  topBottom: (top, bottom) => randPick([
    `tuck the ${top} into the ${bottom} for a bit more shape, or leave it loose if you're feeling lazy today — both work`,
    `half-tuck the ${top} into the ${bottom} and you're basically done, no overthinking needed`,
    `let the ${top} fall loose over the ${bottom} for that didn't-try-too-hard look`,
    `knot the ${top} at the waist over the ${bottom} for a little extra shape`,
    `keep the ${top} relaxed and let the ${bottom} do the structural work — easy balance`,
    `tuck in just the front of the ${top} for a quick, effortless shape with the ${bottom}`,
  ]),
  topOnly: (top) => randPick([
    `let the ${top} be the main character here and keep everything else quiet`,
    `build the whole look around the ${top} — it's doing enough on its own`,
  ]),
  bottomOnly: (bottom) => randPick([
    `keep it simple up top and let the ${bottom} lead the look`,
    `build around the ${bottom} with something fitted up top so it doesn't get lost`,
  ]),
  generic: () => randPick([`keep the proportions easy and let the pieces do their own thing`]),
};

function outerLine(outer){
  const n = outer.name.toLowerCase();
  return randPick([
    `throw the ${n} on open so it doesn't fight with the rest of the fit, or button it up if it gets colder`,
    `the ${n} is an easy add — wear it open for a relaxed look, or buttoned if you want it more put together`,
    `layer the ${n} over everything, you can take it on and off all day depending on how you're feeling`,
    `the ${n} pulls the whole thing together without you having to think about it twice`,
  ]);
}

function shoePhrase(shoe){
  const n = shoe.name.toLowerCase();
  if(/sneaker|chuck|converse/i.test(n)) return randPick([
    `some ${n} to keep it cool and low-key`,
    `the ${n} for an easy, no-effort finish`,
    `${n} because comfort still matters more than people think`,
  ]);
  if(/heel|pump|stiletto|mule/i.test(n)) return randPick([
    `the ${n} for a little drama`,
    `${n} to dress the whole thing up instantly`,
  ]);
  if(/boot/i.test(n)) return randPick([
    `the ${n} for a bit of edge`,
    `${n} to ground the look without trying too hard`,
  ]);
  if(/sandal/i.test(n)) return randPick([
    `the ${n} to keep it breezy`,
    `${n} for a low-maintenance finish`,
  ]);
  if(/mary jane|flat|loafer/i.test(n)) return randPick([
    `the ${n} to keep things polished but still comfortable`,
  ]);
  return randPick([`the ${n} to finish it off`, `some ${n} to round it out`]);
}

function accPhrase(it){
  const n = it.name.toLowerCase(), sub = it.subcategory || "";
  if(sub==="Bags") return randPick([
    `a ${n} to carry your stuff without messing up the fit`,
    `the ${n} for your phone, cards, whatever you actually need today`,
  ]);
  if(sub==="Headwear & Neckwear") return randPick([
    `a ${n} to look cool and a little mysterious`,
    `the ${n} for some main-character energy`,
    `throw on the ${n} for just enough personality`,
  ]);
  if(sub==="Jewelry") return randPick([
    `the ${n} for a little extra shine`,
    `the ${n}, a small detail that actually makes a difference`,
  ]);
  if(sub==="Glasses") return randPick([`the ${n} to tie it all together`]);
  if(sub==="Belts") return randPick([`the ${n} to cinch things in a bit`]);
  if(sub==="Socks") return randPick([`the ${n}, because little details matter too`]);
  return randPick([`the ${n} to finish things off`]);
}

function vibeLine(aesthetic, occasion, baseStyle){
  const base = baseStyle==="Korean" ? "clean, put-together Korean-street" : baseStyle==="Cali" ? "sun-washed Cali" : "effortless";
  const aes = aesthetic ? aesthetic.toLowerCase() : "";
  const occ = occasion ? occasion.toLowerCase() : "";
  const opts = [];
  if(aes && occ) opts.push(`it's giving ${aes}, and honestly it's exactly right for ${occ}`);
  if(aes) opts.push(`total ${aes} energy with a ${base} twist`);
  if(occ) opts.push(`this is exactly the kind of look you want for ${occ}`);
  opts.push(`it's giving ${base} — effortless, but still put together`);
  return randPick(opts);
}

function makeNote(items, ctx){
  ctx = ctx || {};
  const isDressItem = (it) => /dress/i.test(((it.noun||"")+" "+(it.name||"")));
  const dress = items.find(i => i.category==="Tops" && isDressItem(i));
  const top = !dress ? items.find(i => i.category==="Tops") : null;
  const bottom = items.find(i => i.category==="Bottoms");
  const outer = items.find(i => i.category==="Outerwear");
  const shoe = items.find(i => i.category==="Shoes");
  const accs = items.filter(i => i.category==="Accessories");
  const nm = (it) => it ? it.name.toLowerCase() : "";

  const mainLine = dress ? STYLE_TIPS.dress(nm(dress))
    : (top && bottom) ? STYLE_TIPS.topBottom(nm(top), nm(bottom))
    : top ? STYLE_TIPS.topOnly(nm(top))
    : bottom ? STYLE_TIPS.bottomOnly(nm(bottom))
    : STYLE_TIPS.generic();

  const sentences = [];
  const wLine = weatherLine(ctx.weather, outer);
  const leadWithWeather = wLine && Math.random() < 0.55;
  if(leadWithWeather) sentences.push(wLine);
  sentences.push(mainLine);
  if(outer && !leadWithWeather) sentences.push(outerLine(outer));
  if(!leadWithWeather && wLine) sentences.push(wLine);

  const tailPhrases = [];
  if(shoe) tailPhrases.push(shoePhrase(shoe));
  accs.slice(0, 2).forEach((a) => tailPhrases.push(accPhrase(a)));
  if(tailPhrases.length){
    const opener = randPick(["finish the fit with", "finish it off with", "top it off with", "round it out with"]);
    sentences.push(`${opener} ${joinNatural(tailPhrases)}`);
  }

  if(Math.random() < 0.7) sentences.push(vibeLine(ctx.aesthetic, ctx.occasion, ctx.baseStyle));

  return sentences.map((s) => capFirst(s) + (/[.!]$/.test(s) ? "" : ".")).join(" ");
}

/* Short vibe words per aesthetic, used to build outfit titles that actually
   describe the look (not a generic "Golden Hour"-style name unrelated to what's
   in the outfit). */
const VIBE_WORDS_BY_AESTHETIC = {
  "Streetwear": ["Street", "Off-Duty", "Edgy"], "Minimalist": ["Minimalist", "Clean", "Simple"],
  "Coquette": ["Sweet", "Coquette", "Girly"],
  "Dark Academia": ["Academia", "Moody", "Scholarly"], "Grunge": ["Grunge", "Rebel", "Edgy"],
  "Cottagecore": ["Cottagecore", "Whimsical", "Countryside"],
  "Y2K": ["Y2K", "Retro", "Throwback"],
};
function titleCaseWords(s){ return s.replace(/\w\S*/g, (t) => t.charAt(0).toUpperCase() + t.slice(1)); }
/* Build an outfit title that actually reflects the pieces/occasion/aesthetic —
   e.g. "Elegant Cardigan Over Jeans", "Athletic Workout Fit" — instead of a
   generic name unrelated to what's in the look. Randomized among several
   applicable templates so five looks in a batch read differently. */
function makeTitle(items, ctx){
  ctx = ctx || {};
  const isDressItem = (it) => /dress/i.test(((it.noun||"")+" "+(it.name||"")));
  const dress = items.find(i => i.category==="Tops" && isDressItem(i));
  const top = !dress ? items.find(i => i.category==="Tops") : null;
  const bottom = items.find(i => i.category==="Bottoms");
  const outer = items.find(i => i.category==="Outerwear");
  const shoe = items.find(i => i.category==="Shoes");
  const nounOf = (it) => it ? titleCaseWords(it.noun || it.name.split(" ").slice(-1)[0]) : "";

  const vibeWords = VIBE_WORDS_BY_AESTHETIC[ctx.aesthetic] || ["Effortless", "Easy", "Everyday"];
  const vibe = randPick(vibeWords);

  const occLower = (ctx.occasion || "").toLowerCase();
  let occWord = null;
  if(/gym|workout/.test(occLower)) occWord = "Workout";
  else if(/party|birthday|night out/.test(occLower)) occWord = "Party Ready";
  else if(/school|class|campus/.test(occLower)) occWord = "School Day";
  else if(/beach|vacation|resort/.test(occLower)) occWord = "Vacation";
  else if(/travel|flight|airport|road ?trip/.test(occLower)) occWord = "Travel Day";
  else if(/formal|wedding|graduation|gala/.test(occLower)) occWord = "Formal";
  else if(/recital|performance/.test(occLower)) occWord = "Performance";
  else if(/date|dinner/.test(occLower)) occWord = "Date Night";
  else if(/business|work|interview|office/.test(occLower)) occWord = "Office Ready";
  else if(/church/.test(occLower)) occWord = "Sunday Best";

  const colorCounts = {};
  items.forEach((it) => { if(it.color) colorCounts[it.color] = (colorCounts[it.color]||0) + 1; });
  const topColors = Object.keys(colorCounts).sort((a,b) => colorCounts[b]-colorCounts[a]).slice(0,2);
  const colorPhrase = topColors.length===2 ? `${topColors[0]} & ${topColors[1]}` : topColors[0];

  const templates = [];
  if(outer && (bottom || dress)) templates.push(`${vibe} ${nounOf(outer)} Over ${nounOf(bottom||dress)}`);
  if(top && bottom) templates.push(`${vibe} ${nounOf(top)} & ${nounOf(bottom)}`);
  if(dress){ templates.push(`${vibe} ${nounOf(dress)} Moment`); templates.push(`${vibe} Dress Day`); }
  if(occWord){ templates.push(`${occWord} ${vibe} Fit`); templates.push(`${vibe} ${occWord} Look`); }
  if(topColors.length){ templates.push(`Simple, ${colorPhrase}`); templates.push(`${colorPhrase} Everyday`); }
  if(shoe) templates.push(`${vibe} Fit With ${nounOf(shoe)}`);
  templates.push(`${vibe} ${ctx.aesthetic || "Everyday"} Look`);

  return randPick(templates.filter(Boolean));
}

/* Per-aesthetic affinity model: which garment types + colours read as each
   aesthetic. Used to bias the built-in stylist toward items that fit the user's
   preferred aesthetics (it's heuristic — the AI stylist reasons about this far
   more precisely). */
const AESTHETIC_TRAITS = {
  "Streetwear":       { types:[/hoodie|sweatshirt|cargo|sneaker|bomber|baseball cap|sweatpant|windbreaker|denim jacket|graphic/], colors:["Black","Gray","Charcoal","White","Olive","Navy"] },
  "Minimalist":       { types:[/turtleneck|trouser|blazer|button-up|knit sweater|loafer|trench|slip dress|tank|midi/], colors:["Black","White","Gray","Beige","Cream","Tan","Navy"] },
  "Coquette":         { types:[/mini skirt|pleated skirt|camisole|ballet flat|mary jane|blouse|mini dress|cardigan|bow|lace/], colors:["Pink","Light Pink","White","Cream","Mauve","Red"] },
  "Dark Academia":    { types:[/blazer|trouser|button-up|turtleneck|loafer|wool coat|pleated skirt|knit sweater|trench|cardigan/], colors:["Brown","Black","Charcoal","Olive","Maroon","Beige","Navy","Cream"] },
  "Grunge":           { types:[/leather jacket|denim jacket|ankle boot|boot|button-up|skinny jean|cargo|hoodie|graphic/], colors:["Black","Charcoal","Gray","Maroon","Olive","Dark Green"] },
  "Cottagecore":      { types:[/midi dress|maxi dress|sundress|blouse|cardigan|wide-brim|ballet flat|pleated skirt|knit/], colors:["Cream","Beige","Green","Olive","Brown","White","Tan","Light Pink"] },
  "Y2K":              { types:[/crop top|skinny jean|mini skirt|cargo|bomber|sneaker|bucket hat|camisole|baby tee/], colors:["Pink","Light Blue","Blue","Purple","Orange","Red"] },
};
function aestheticAffinity(item, aesthetic){
  const t = AESTHETIC_TRAITS[aesthetic]; if(!t) return 0;
  const txt = ((item.noun||"")+" "+(item.name||"")).toLowerCase();
  let s = 0;
  if(t.types){ for(const re of t.types){ if(re.test(txt)){ s += 2; break; } } }
  if(t.colors && item.color && t.colors.indexOf(item.color) >= 0) s += 1.5;
  return s;
}

/* Occasion → what to lean into vs avoid. Keyword-matched so it works for both the
   dropdown options AND a free-typed occasion (e.g. "frat party" → party rules). */
/* Some categories (sandals, mainly) aren't inherently casual OR formal — it depends
   on how the user described the piece. If their own item name/type signals it's
   dressy ("elegant heeled sandals"), don't punish it just for being a sandal. */
const FANCY_QUALIFIER_RE = /\bformal\b|\bfancy\b|elegant|dressy|\bheeled\b|dress sandal/i;
const HAT_RE = /\bhat\b|beanie|baseball cap|bucket hat|beret|wide-brim/i;
/* First matching rule wins, so the dressiest / most specific occasions come first.
   avoid: hard no, never shown for this occasion.
   avoidCasual: hard no UNLESS the item's own name/type reads as dressy (FANCY_QUALIFIER_RE) —
     e.g. plain sandals are out, but "elegant heeled sandals" are fine.
   limit: still allowed, just soft-deprioritized (shows up less often, not banned). */
const OCCASION_RULES = [
  // Recital / performance — someone actually PERFORMING (piano/dance recital,
  // orchestra, choir, etc.): polished and stage-appropriate. No hoodie, hats, winter
  // boots/Uggs, sunglasses, or flip-flops — none of that belongs on a performer.
  { match:/recital|performance|performing|classical concert|symphony|orchestra|opera|choir|piano|dance recital/i,
    boost:[/dress|maxi dress|midi dress|blouse|trouser|blazer|heel|pumps|mules|button-up/],
    avoid:[HAT_RE, /hoodie|sweat|jean|denim|cargo|sneaker|short|legging|flannel|tank|gym|ugg|winter boot|snow boot|sunglasses|flip flop/],
    avoidCasual:[/sandal/] },
  // Formal — weddings, galas, graduations: dressy, no denim/sneakers/sweats/hats/
  // winter boots. Plain sandals are out, but ones the user calls formal/elegant/
  // heeled are fine.
  { match:/formal|wedding|gala|cocktail|ceremony|banquet|prom|black ?tie|graduation|gown/i,
    boost:[/dress|maxi dress|midi dress|gown|heel|blouse|trouser|blazer|mules|pumps/],
    avoid:[HAT_RE, /jean|denim|sweat|hoodie|cargo|sneaker|short|legging|flannel|tank|gym|ugg|winter boot|snow boot/],
    avoidCasual:[/sandal/] },
  // Party / night out — birthdays, clubs, dances: dressy, lean skirts/dresses/heels.
  // Sneakers/chucks are allowed but shouldn't dominate every look — fancy shoes get
  // priority instead. Flip-flops are a hard no (they fall off); plain sandals are
  // out too unless the user's own item name says they're dressy.
  { match:/party|club|night ?out|birthday|homecoming|dance|new ?year|nye|going out/i,
    boost:[/dress|bodycon|mini skirt|skirt|heel|blouse|crop top|camisole|mules/],
    avoid:[/sweatpant|hoodie|cargo|legging|gym|jean|sundress|flannel|puffer|flip flop/],
    avoidCasual:[/sandal/],
    limit:[/sneaker|chuck|converse/] },
  // Date / dinner — romantic, polished
  { match:/date|dinner|romantic|valentine|anniversary/i,
    boost:[/dress|blouse|skirt|heel|ballet flat|trouser|camisole|cardigan/], avoid:[/sweatpant|hoodie|cargo|gym|legging|flannel/] },
  // Business / professional — work, interviews, meetings ("\bwork\b" so it doesn't
  // swallow "workout").
  { match:/business|\bwork\b|office|meeting|interview|professional|conference|presentation/i,
    boost:[/blazer|trouser|button-up|loafer|midi skirt|trench|knit sweater|heel|turtleneck|pumps/], avoid:[/hoodie|sweatpant|cargo|crop top|graphic|sneaker|short|bodycon|legging/] },
  // Concert / festival — trendy and edgy; casual stays fine ("\bshow\b" so it
  // doesn't swallow "shower"; "\brave\b" so it doesn't swallow "travel").
  { match:/concert|festival|\bshow\b|gig|\brave\b|\bbar\b/i,
    boost:[/boot|leather jacket|denim jacket|graphic|crop top|cargo|bomber|skirt|sneaker/], avoid:[/blazer|trouser|loafer|pumps|trench/] },
  // Church / worship — modest, smart
  { match:/church|worship|service|temple|mass|mosque/i,
    boost:[/dress|midi dress|blouse|skirt|cardigan|trouser|ballet flat|loafer/], avoid:[/crop top|bodycon|sweatpant|gym|legging|cargo|tank/] },
  // Smart-casual social — brunch, coffee, family/holiday gatherings, photos
  { match:/brunch|lunch|coffee|cafe|gathering|holiday|family|reunion|shower|photo|picnic/i,
    boost:[/blouse|sundress|midi dress|jean|cardigan|skirt|loafer|ballet flat|sweater/], avoid:[/sweatpant|gym|hoodie/] },
  // School / class — jeans/tees/sneakers territory; a dressy dress reads as
  // overdressed (sundress is the one exception, still fine for a warm campus day).
  { match:/school|class|college|campus|lecture|study/i,
    boost:[/jean|sweater|hoodie|sneaker|cardigan|t-shirt|tee|trouser|cargo|skirt/], avoid:[/heel|bodycon|gown|sequin|(?<!sun)dress/] },
  // Everyday casual — hangouts, errands, shopping. Same logic: a sundress is
  // casual, but a mini/bodycon/midi dress reads too done-up for a hangout.
  { match:/casual|hangout|hang out|errand|weekend|chill|mall|shopping|day out|stroll/i,
    boost:[/jean|t-shirt|tee|sneaker|sweater|cardigan|hoodie|short|sundress/], avoid:[/heel|bodycon|gown|blazer|(?<!sun)dress/] },
  // Travel Day — actually IN TRANSIT (plane/train/road trip/commute): pure comfort
  // for a long ride, deliberately NOT the stylish/photogenic pieces Vacation goes
  // for (no exception for sundresses here — those are Vacation's job).
  // Sweats/leggings/hoodies over anything dressy or fitted.
  { match:/travel|flight|airport|road ?trip|commute|plane|train ride/i,
    boost:[/legging|sweatpant|hoodie|sneaker|jean|sweater|cardigan|tank|jogger/],
    avoid:[/heel|bodycon|gown|blazer|trouser|mules|pumps|sandal|skirt|dress/] },
  // Gym / active
  { match:/gym|workout|exercise|run|yoga|sport|hike|pilates|fitness/i,
    boost:[/legging|sweatpant|sneaker|tank|short|hoodie/], avoid:[/dress|heel|blouse|skirt|loafer|trouser|coat|boot|jean|blazer|cardigan|sundress|mary jane|mules|sandal/] },
  // Beach / vacation — stylish, good-in-photos resort wear, deliberately NOT the
  // cozy loungewear Travel Day is for. Sneakers are fine for sightseeing but
  // shouldn't dominate every look — sundresses/sandals get priority.
  { match:/beach|pool|vacation|resort|tropical|cruise|summer/i,
    boost:[/sundress|short|sandal|tank|maxi dress|camisole/],
    avoid:[/coat|wool|blazer|boot|heel|sweater|puffer|trench|mary jane|loafer|ballet flat|mules|jean|sweatpant|legging|hoodie/],
    limit:[/sneaker/] },
];
/* Hard exclusion only — used as the pass/fail GATE (>=0 means "allowed at all").
   A "limit" item is NOT excluded here; it's still fully eligible, just ranked
   lower by occasionAffinity() below. */
function occasionAvoid(item, occText){
  if(!occText) return 0;
  const rule = OCCASION_RULES.find(r => r.match.test(occText));
  if(!rule) return 0;
  const txt = ((item.noun||"")+" "+(item.name||"")).toLowerCase();
  const fancy = FANCY_QUALIFIER_RE.test(txt);
  if(rule.avoid && rule.avoid.some(re => re.test(txt))) return -3;
  if(rule.avoidCasual && !fancy && rule.avoidCasual.some(re => re.test(txt))) return -3;
  return 0;
}
/* Full ranking signal (used only for scoring/rotation, never as the hard gate):
   hard-avoid penalty + boost bonus + a gentler "limit" penalty that lets an item
   still appear sometimes, just not dominate every look. */
function occasionAffinity(item, occText){
  if(!occText) return 0;
  const rule = OCCASION_RULES.find(r => r.match.test(occText));
  if(!rule) return 0;
  const txt = ((item.noun||"")+" "+(item.name||"")).toLowerCase();
  const fancy = FANCY_QUALIFIER_RE.test(txt);
  let s = occasionAvoid(item, occText);
  if(rule.boost.some(re => re.test(txt))) s += 2.5;
  if(rule.limit && !fancy && rule.limit.some(re => re.test(txt))) s -= 1.2;
  return s;
}

/* Compose up to 5 coherent outfits from real closet items.
   opts.tryNew: include 1-2 "try something new" looks; off = all on preferred vibe.
   opts.baseStyle: "Cali" | "Korean" — picks the model photo set + note flavor. */
function buildOutfits(closet, likedAesthetics, favorites, opts){
  opts = opts || {};
  const byCat=c=>closet.filter(i=>i.category===c);
  const tops=byCat("Tops"),bottoms=byCat("Bottoms"),shoes=byCat("Shoes"),
        outer=byCat("Outerwear"),acc=byCat("Accessories");
  if(closet.length<2||(tops.length===0&&bottoms.length===0))return [];
  const favItemIds=new Set((favorites||[]).flatMap(f=>(f.items||[]).map(it=>it.id)));
  // Learned preferences from past ratings / swipe-aways.
  const fb=opts.feedback||{};
  const aScore=a=>(fb.aesthetic&&fb.aesthetic[a])||0;
  const iScore=id=>(fb.item&&fb.item[id])||0;

  // Aesthetic plan for the 5 looks — drop strongly-disliked aesthetics and lead
  // with the ones the user has rated highest. Also filter to aesthetics that
  // still EXIST in the current AESTHETICS list: a favorited outfit or saved pick
  // from an older build can carry a retired label (e.g. "Soft Girl", "Clean
  // Girl"), and without this those stale names leak back out as freshly
  // generated outfits.
  const likedArr=[...likedAesthetics].filter(a=>AESTHETICS.includes(a)&&aScore(a)>-3);
  const preferred=(likedArr.length?likedArr:["Minimalist","Coquette","Streetwear"]).slice().sort((a,b)=>aScore(b)-aScore(a));
  const others=AESTHETICS.filter(a=>!likedAesthetics.has(a)&&aScore(a)>-2).sort((a,b)=>aScore(b)-aScore(a));
  const plan=[];
  for(let i=0;i<5;i++){
    if(opts.tryNew && i>=3 && others.length){ plan.push({a:others[(i-3)%others.length],familiar:false}); }
    else { plan.push({a:preferred[i%preferred.length],familiar:true}); }
  }
  // Weather-aware: skip outerwear when it's warm out.
  const wTemp = opts.weather && opts.weather.temp;
  const wantOuter = (wTemp==null) || wTemp <= 72;

  // How well an item fits a slot for a given aesthetic. Aesthetic match dominates,
  // then learned ratings + favorites.
  // A small per-item random jitter (fixed for THIS generation call, via jitterMap)
  // reshuffles near-ties so hitting "Generate Outfits" again — even for the same
  // occasion — surfaces a different combination instead of the literal same 5
  // looks every time. It's too small to override a real aesthetic/occasion signal.
  const jitterMap = new Map();
  const jitter = (id) => { if(!jitterMap.has(id)) jitterMap.set(id, (Math.random()-0.5)*0.8); return jitterMap.get(id); };
  const score=(it,aes)=> 2.4*aestheticAffinity(it,aes) + occasionAffinity(it,opts.occasion) + iScore(it.id) + (it.fav?0.6:0) + (favItemIds.has(it.id)?0.6:0) + jitter(it.id);
  const rankedFor=(arr,aes)=>[...arr].sort((a,b)=>score(b,aes)-score(a,aes));
  const isDress=it=>!!it && /dress/i.test((it.noun||"")+" "+(it.name||""));
  // Up to 2 accessories from DIFFERENT sub-categories (never two bags). The
  // sub-categories chosen stay whichever best match the aesthetic, but WHICH
  // item within a sub-category (e.g. which of 3 bags) rotates with `i` so
  // owning several bags/necklaces/etc. actually gets used across looks.
  const accGroups = (() => {
    const g = new Map();
    for (const it of acc) { const sub = it.subcategory || "Acc"; if (!g.has(sub)) g.set(sub, []); g.get(sub).push(it); }
    return [...g.entries()];
  })();
  // `slotIdx` is which OUTPUT LOOK this is (0,1,2,3,4 — not the attempt counter),
  // so across exactly 5 looks it's guaranteed to visit every residue mod pool
  // size. The within-subcategory item order is intentionally aesthetic-INDEPENDENT
  // (favorites/ratings only) — if it were re-ranked per aesthetic like tops/bottoms,
  // an aesthetic-driven reshuffle could "hide" an item behind the same residue on
  // every visit (e.g. 3 bags, 5 looks, one aesthetic reorders them right when the
  // rotation would have reached the 3rd) and it would never get picked.
  const pickAccs=(aes,slotIdx)=>{
    const groups = accGroups.map(([sub, items]) => {
      const ok = items.filter(it => occasionAvoid(it, opts.occasion) >= 0);
      // Unlike tops/bottoms/shoes, an accessory sub-category is never REQUIRED —
      // if every item in it is occasion-inappropriate (e.g. the only glasses you
      // own are sunglasses, wrong for a recital), just skip the whole sub-category
      // rather than falling back to the disallowed item.
      if (!ok.length) return null;
      const stable = [...ok].sort((a, b) =>
        (iScore(b.id) + (b.fav?0.6:0) + (favItemIds.has(b.id)?0.6:0)) -
        (iScore(a.id) + (a.fav?0.6:0) + (favItemIds.has(a.id)?0.6:0)));
      return { sub, stable, aesBest: score(rankedFor(ok, aes)[0], aes) };
    }).filter(Boolean).sort((a, b) => b.aesBest - a.aesBest);   // which sub-categories lead is still aesthetic-aware
    const out = [];
    for (const g of groups) { if (out.length >= 2) break; out.push(g.stable[slotIdx % g.stable.length]); }
    return out;
  };

  const outfits=[],used=new Set();
  const push=(set,pe)=>{
    let items=set.filter(Boolean);
    // Never wear two of the same single-wear slot (two bags, two hats, two pairs
    // of shoes, etc.).
    const seenSlot=new Set();
    items=items.filter(it=>{ const slot=it.category==="Accessories"?("acc:"+(it.subcategory||"")):it.category; if(seenSlot.has(slot))return false; seenSlot.add(slot); return true; });
    if(items.length<2||outfits.length>=5)return;
    const key=items.map(i=>i.id).sort().join("-");if(used.has(key))return;used.add(key);
    outfits.push({
      id:"gen_"+key,
      title:makeTitle(items,{ aesthetic:pe.a, occasion:opts.occasion }),
      aesthetic:(opts.baseStyle?opts.baseStyle+" · ":"")+pe.a,
      note:makeNote(items,{ baseStyle:opts.baseStyle, aesthetic:pe.a, occasion:opts.occasion, weather:opts.weather, idx:outfits.length }),
      items:items.map(i=>({id:i.id,name:i.name,category:i.category,photo:i.photo})),
      familiar:pe.familiar,
    });
  };

  // Build one look per planned aesthetic, choosing the closet items that best match
  // it. Occasion-inappropriate pieces (jeans/sneakers for a party, sweatpants for
  // the beach, etc.) are dropped entirely as long as the category still has a
  // suitable option left — that's the correctness gate. Within what's left, we
  // rotate through a generous pool (not just the single best) so every piece the
  // user owns actually gets a turn, and keep cycling extra rounds to reach five.
  for(let i=0;i<24 && outfits.length<5;i++){
    const pe=plan[i%plan.length], aes=pe.a;
    // `required`: tops/bottoms/shoes MUST produce something (an outfit needs them),
    // so if every item is occasion-avoided, fall back to the full list rather than
    // leaving the slot empty. Outerwear is OPTIONAL — if every jacket/hoodie is
    // wrong for the occasion, just skip outerwear entirely instead of forcing in
    // a banned piece because it's the only one owned.
    const pick=(arr,n,required=true)=>{
      if(!arr.length) return null;
      const ok=arr.filter(it=>occasionAvoid(it,opts.occasion)>=0);
      if(!ok.length && !required) return null;
      const cand=ok.length?ok:arr;
      const ranked=rankedFor(cand,aes);
      const pool=ranked.slice(0,Math.min(n,ranked.length));
      return pool[i%pool.length];
    };
    const top=pick(tops,4);
    const dress=isDress(top);
    // A dress doesn't get a hoodie/sweater thrown over it — those are fine over a
    // skirt+top look, just not over a dress. Blazers/cardigans/coats still can.
    const outerPool=dress?outer.filter(it=>!CASUAL_LAYER_RE.test((it.noun||"")+" "+(it.name||""))):outer;
    const slotIdx=outfits.length;   // which output look this attempt would become
    const set=[top, dress?null:pick(bottoms,4), pick(shoes,3), wantOuter?pick(outerPool,2,false):null, ...pickAccs(aes,slotIdx)];
    push(set,pe);
  }
  return outfits.slice(0,5);
}

/* ---------- learning / persistence ----------
   Outfit feedback (star ratings + swipe-aways) is accumulated into running scores
   per aesthetic and per item, then fed back into outfit generation so looks get
   more personalized over time. STYLE_STARS+ ratings promote that look's aesthetic
   into the user's style.

   Storage is IndexedDB, NOT localStorage: closet photos are far larger than the
   ~5MB localStorage cap, which silently dropped them and left placeholder icons
   after a reload. IndexedDB has a much larger quota and keeps the real photos. */
const STATE_LS = "fitcheck_state_v1";   // legacy localStorage key (migration only)
const STATE_KEY = "state";
const STYLE_STARS = 4;
function emptyFeedback(){ return { ratings:{}, aesthetic:{}, item:{}, corrections:{} }; }
const bareAesthetic = (a) => { a = a || ""; const i = a.indexOf("· "); return (i >= 0 ? a.slice(i + 2) : a).trim(); };

/* ---------- plans & daily generation limit ----------
   IMPORTANT: this is a single static HTML file with no backend, database, or
   payment processor — there is nowhere to run real billing or verify shares.
   "Plans" below are a LOCAL, device-only demo: picking one instantly changes
   your daily limit here for design/testing purposes. No payment is collected
   anywhere. Shipping this for real users would mean wiring a real payment
   provider + server first. Usage/plan are stored in prefs (same IndexedDB as
   everything else), so they DO persist across reloads on this device/browser
   — but a user can reset them by clearing site data, since nothing server-side
   enforces the cap. */
const PLANS = [
  { key:"free", label:"Starter Pack", price:"$0",     period:"",    limit:15,       blurb:"15 outfit generations a day" },
  { key:"plus", label:"Plus",         price:"$9.99",  period:"/mo", limit:20,       blurb:"20 generations a day" },
  { key:"pro",  label:"Pro",          price:"$24.99", period:"/mo", limit:35,       blurb:"35 generations a day" },
  { key:"max",  label:"Unlimited",    price:"$99.99", period:"/mo", limit:Infinity, blurb:"Unlimited generations, every day" },
];
const SHARE_BONUS = 5;                 // bonus generations granted per share
const MAX_SHARE_BONUSES_PER_DAY = 3;   // caps stacking from repeated taps (15/day max)
// No real payment processing exists yet — every user is hard-locked to the free
// Starter Pack limit no matter what's stored in prefs.plan, so nobody can just
// tap a paid tier and get more generations for free. Flip to true once billing
// is actually wired up.
const BILLING_LIVE = false;
// Whoever's testing/demoing the app can sign in with this account to unlock every
// plan (including Unlimited) despite BILLING_LIVE being off — everyone else stays
// locked to Starter Pack exactly as before.
const UNLOCKED_TEST_EMAILS = new Set(["roy.lxy@gmail.com", "olivia.liu730@gmail.com"]);
const plansUnlocked = (email) => BILLING_LIVE || (!!email && UNLOCKED_TEST_EMAILS.has(email.toLowerCase()));
const planByKey = (key, email) => PLANS.find((p) => p.key === (plansUnlocked(email) ? key : "free")) || PLANS[0];

/* Diagnostic breadcrumb for the phone-only "scan interrupts / tab reloads"
   bug: localStorage survives a real page reload (React state doesn't), so we
   stamp which stage a scan is in as it progresses. If the app ever comes back
   up mid-scan (a crash/reload, not a normal finish), we can tell the user
   exactly where it died — real data instead of guessing blind. */
const SCAN_STAGE_LS = "fitcheck_last_scan_stage";
function markScanStage(stage){ try { localStorage.setItem(SCAN_STAGE_LS, JSON.stringify({ stage, at: Date.now() })); } catch (e) {} }
function clearScanStage(){ try { localStorage.removeItem(SCAN_STAGE_LS); } catch (e) {} }
function takeInterruptedScan(){
  try {
    const raw = localStorage.getItem(SCAN_STAGE_LS);
    localStorage.removeItem(SCAN_STAGE_LS);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    return (Date.now() - parsed.at) < 10 * 60 * 1000 ? parsed : null;   // ignore anything stale (>10 min old)
  } catch (e) { return null; }
}
/* Local calendar date (not UTC) — "today" should match the user's own day. */
function todayKey(){ const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function getUsage(prefs){
  const u = prefs && prefs.usage;
  const today = todayKey();
  if (!u || u.date !== today) return { date: today, count: 0, shareBonuses: 0 };  // rolls over at midnight
  return u;
}
function generationsRemaining(prefs, email){
  const plan = planByKey((prefs && prefs.plan) || "free", email);
  if (plan.limit === Infinity) return Infinity;
  const u = getUsage(prefs);
  return Math.max(0, plan.limit + u.shareBonuses * SHARE_BONUS - u.count);
}

function idbOpen(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open("fitcheck", 1);
    r.onupgradeneeded = () => { try { r.result.createObjectStore("kv"); } catch (e) {} };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbGet(key){
  try { const db = await idbOpen(); return await new Promise((res, rej) => {
    const t = db.transaction("kv", "readonly").objectStore("kv").get(key);
    t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error);
  }); } catch (e) { return null; }
}
async function idbSet(key, val){
  try { const db = await idbOpen(); return await new Promise((res, rej) => {
    const tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").put(val, key);
    tx.oncomplete = () => res(true); tx.onerror = () => rej(tx.error);
  }); } catch (e) { return false; }
}
// One-time migration of any wardrobe saved by the older localStorage build.
function loadLegacyState(){ try { return JSON.parse(localStorage.getItem(STATE_LS)) || null; } catch (e) { return null; } }

/* ---------- Cloud sync (Firestore) ----------
   Closet/trash/favorites/styleBoard items carry photos (base64 data URLs), and
   Firestore caps a single document at 1MB — a whole wardrobe as one JSON blob
   could blow past that. So each item lives as its OWN document in a
   sub-collection (users/{uid}/closet/{itemId}, etc.); only the small stuff
   (aesthetics, plan, ratings, account) lives in the one users/{uid} doc. */
const CLOUD_SUBCOLLECTIONS = ["closet", "trash", "favorites", "styleBoard"];
async function pullCloudState(uid){
  const mainSnap = await getDoc(doc(db, "users", uid));
  const subSnaps = await Promise.all(CLOUD_SUBCOLLECTIONS.map((name) => getDocs(collection(db, "users", uid, name))));
  const toArr = (snap) => snap.docs.map((d) => d.data());
  const [closet, trash, favorites, styleBoard] = subSnaps.map(toArr);
  return {
    exists: mainSnap.exists(),
    prefs: mainSnap.exists() ? { ...(mainSnap.data().prefs || {}), styleBoard } : null,
    closet, trash, favorites,
  };
}
/* Upsert every current item + delete any that were there last sync but aren't
   anymore — diffed against the id set from the previous sync (passed in via a
   ref so it survives across calls without re-reading the whole collection). */
async function syncCloudCollection(uid, name, items, prevIds){
  const colRef = collection(db, "users", uid, name);
  const currentIds = new Set((items || []).map((i) => i.id));
  const batch = writeBatch(db);
  (items || []).forEach((item) => batch.set(doc(colRef, item.id), item));
  prevIds.forEach((id) => { if (!currentIds.has(id)) batch.delete(doc(colRef, id)); });
  await batch.commit();
  return currentIds;
}
/* The small users/{uid} doc: everything in prefs EXCEPT styleBoard (that's its
   own sub-collection, synced separately since it carries outfit photos too). */
async function pushCloudMain(uid, prefs, onboarded){
  const { styleBoard, ...rest } = prefs || {};
  await setDoc(doc(db, "users", uid), { prefs: rest, onboarded, updatedAt: serverTimestamp() }, { merge: true });
}

/* --- live weather (Open-Meteo, no API key; geolocation, with IP fallback) --- */
function weatherDesc(code, temp){
  let condition = "Clear", icon = "sun";
  if(code===0){ condition="Clear"; icon="sun"; }
  else if(code<=2){ condition="Partly cloudy"; icon="sun"; }
  else if(code===3){ condition="Cloudy"; icon="cloud"; }
  else if(code===45||code===48){ condition="Foggy"; icon="cloud"; }
  else if(code>=51&&code<=67){ condition="Rainy"; icon="rain"; }
  else if(code>=71&&code<=77){ condition="Snowy"; icon="snow"; }
  else if(code>=80&&code<=82){ condition="Showers"; icon="rain"; }
  else if(code>=85&&code<=86){ condition="Snow showers"; icon="snow"; }
  else if(code>=95){ condition="Thunderstorm"; icon="rain"; }
  let tip = "Dressing for the day.";
  if(temp!=null){
    if(temp<=40) tip="Bundle up — a warm coat is a must.";
    else if(temp<=55) tip="Jacket-and-layers weather.";
    else if(temp<=68) tip="Light layers — great for a cardigan.";
    else if(temp<=80) tip="Warm — keep it light and breezy.";
    else tip="Hot — go airy and minimal.";
  }
  return { condition, icon, tip };
}
async function fetchWeather(){
  let lat=null, lon=null, place=null;
  try {
    const pos = await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{ timeout:8000, maximumAge:600000 }));
    lat=pos.coords.latitude; lon=pos.coords.longitude;
  } catch(e){
    try { const ip = await (await fetch("https://ipapi.co/json/")).json(); lat=ip.latitude; lon=ip.longitude; place=ip.city; } catch(e2){}
  }
  if(lat==null) return null;
  try {
    const u = "https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon+"&current=temperature_2m,apparent_temperature,weather_code&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=auto";
    const w = await (await fetch(u)).json();
    const cur = w.current||{};
    const temp = Math.round(cur.temperature_2m);
    const dmax = w.daily&&w.daily.temperature_2m_max&&w.daily.temperature_2m_max[0];
    const dmin = w.daily&&w.daily.temperature_2m_min&&w.daily.temperature_2m_min[0];
    return { temp, feels: Math.round(cur.apparent_temperature), high: Math.round(dmax), low: Math.round(dmin), code: cur.weather_code, place, ...weatherDesc(cur.weather_code, temp) };
  } catch(e){ return null; }
}
function WeatherIcon({ icon, size, color }){
  return icon==="sun" ? <Sun size={size} color={color} /> : <Cloud size={size} color={color} />;
}

function stockImageUrl(item){
  const n = (item.name||"").toLowerCase();
  for(const e of CLOTHING_STOCK){ if(e.kw.some(k=>n.includes(k))) return "https://images.unsplash.com/"+e.id+STOCK_W; }
  return null; // no clean match -> use the user's own cutout
}
function StockImg({ item }) {
  // Prefer the user's own cutout so the picture matches the exact item they shot;
  // fall back to a type-matched stock photo for manually-added items (no photo).
  const [src, setSrc] = useState(item.photo || stockImageUrl(item));
  return <img src={src} alt={item.name} className="w-full h-full object-cover"
    onError={() => { const sb = stockImageUrl(item); if (sb && src !== sb) setSrc(sb); }} />;
}
function OutfitCollage({ items, pastel, height = 260, bg }) {
  const list = (items || []).slice(0, 5);
  const big = list.length <= 2;
  return (
    <div className="w-full rounded-3xl overflow-hidden relative flex flex-wrap items-center justify-center gap-2 p-3"
      style={{ height, background: bg || (pastel.ring + "55") }}>
      {list.map((it) => (
        <div key={it.id} className="rounded-2xl overflow-hidden bg-white shadow-sm flex items-center justify-center"
          style={{ width: big ? "46%" : "30.5%", height: big ? "88%" : "46%" }}>
          {(it.photo || it.name) ? <StockImg item={it} />
                    : <CatIcon category={it.category} size={28} color={pastel.text} />}
        </div>
      ))}
    </div>
  );
}

  const remaining = generationsRemaining(prefs, user?.email);

  const handleRate = (o, s) => { setRatings((r) => ({ ...r, [o.id]: s })); onRate && onRate(o, s); };
  const handleDismiss = (o) => { setOutfits((list) => list.filter((x) => x.id !== o.id)); onDismiss && onDismiss(o); };

  const generate = () => {
    if (remaining <= 0) { goProfile && goProfile(); return; }   // guard — FAB already prevents this in the normal flow
    setGenerating(true);
    setTried(true);
    setOutfits([]);
    // Looks the user leans toward: favorited outfits' aesthetics + profile picks.
    const favAesthetics = favorites.map((f) => f.aesthetic);
    const likedAesthetics = new Set([...favAesthetics, ...(prefs?.aesthetics || [])]);
    const occ = custom.trim() || occasion;
    setTimeout(() => {
      const built = buildOutfits(closet, likedAesthetics, favorites, { tryNew: !!prefs?.tryNew, baseStyle: prefs?.baseStyle, occasion: occ, weather, feedback: prefs?.feedback });
      setOutfits(built.map((o, i) => ({ ...o, pastel: PASTELS[i % PASTELS.length] })));
      // Cost is per OUTFIT produced (usually 5), not per click — a sparse closet
      // that only yields 2 looks only spends 2 generations.
      if (built.length) onUseGeneration && onUseGeneration(built.length);
      setGenerating(false);
    }, 500);
  };

  return (
    <div className="pb-40">
      <WeatherBar weather={weather} />

      <h1 className="text-[34px] leading-tight font-black mt-4 mb-2" style={{ color: "#5A5167" }}>Outfit ideas, just<br />a click away</h1>

      {/* daily generation usage — own line, above Occasion */}
      <div className="mb-4">
        <button onClick={goProfile}
          className="inline-flex items-center gap-1.5 text-[11.5px] font-extrabold px-3 py-1.5 rounded-full active:scale-95 transition-transform"
          style={{ background: remaining <= 0 ? "#FCEDE6" : "#F1ECFB", color: remaining <= 0 ? "#CC8567" : "#8E78C0" }}>
          <Zap size={12} />
          {dailyLimit === Infinity ? "Unlimited generations" : `${remaining} generation${remaining === 1 ? "" : "s"} left today`}
        </button>
      </div>

      {/* Occasion */}
      <label className="text-xs font-bold uppercase tracking-wide" style={{ color: "#A99FB5" }}>Occasion</label>
      <div className="relative mt-2 mb-3">
        <select value={occasion} onChange={(e) => setOccasion(e.target.value)}
          className="w-full appearance-none rounded-2xl px-4 py-4 text-[15px] font-bold outline-none"
          style={{ background: "#fff", border: "1.5px solid #EFE3F0", color: "#6E6480" }}>
          <option value="">Pick an occasion…</option>
          {OCCASIONS.map((o) => <option key={o}>{o}</option>)}
        </select>
        <ChevronDown size={18} className="absolute right-4 top-4 pointer-events-none" color="#C6BCD2" />
      </div>
      <input value={custom} onChange={(e) => setCustom(e.target.value)}
        placeholder="…or type your own occasion"
        className="w-full rounded-2xl px-4 py-3.5 text-[14px] font-semibold outline-none mb-6"
        style={{ background: "#fff", border: "1.5px solid #EFE3F0", color: "#6E6480" }} />

      {/* Not enough pieces after a generate attempt */}
      {tried && !generating && outfits.length === 0 && (
        <div className="rounded-3xl p-6 text-center" style={{ background: "#FCEDE6" }}>
          <div className="w-16 h-16 rounded-3xl mx-auto flex items-center justify-center mb-3" style={{ background: "#ffffffcc" }}>
            <CameraIcon size={28} color="#CC8567" />
          </div>
          <div className="text-[15px] font-black mb-1" style={{ color: "#5A5167" }}>Not enough pieces yet</div>
          <p className="text-[13px] font-semibold" style={{ color: "#A99FB5" }}>
            Add at least a top and a bottom in the Camera tab, then generate again.
          </p>
        </div>
      )}

      {/* Empty state — fills space before generating */}
      {outfits.length === 0 && !generating && !tried && (
        <div className="rounded-3xl p-7 text-center" style={{ background: "linear-gradient(160deg,#FDE9F1,#F1ECFB)" }}>
          <div className="w-20 h-20 rounded-3xl mx-auto flex items-center justify-center mb-4" style={{ background: "#ffffffcc" }}>
            <Sparkles size={38} color="#C56B96" />
          </div>
          <div className="text-[18px] font-black mb-1" style={{ color: "#5A5167" }}>Ready when you are</div>
          <p className="text-[13.5px] font-semibold leading-relaxed mb-5" style={{ color: "#A99FB5" }}>
            Pick an occasion above, then tap Generate Outfits to get five looks styled from your closet.
          </p>
          <div className="grid grid-cols-3 gap-2.5">
            {[
              { label: "Curated", icon: Shirt },
              { label: "Weather-aware", icon: Cloud },
              { label: "Your vibe", icon: Heart },
            ].map((f, i) => {
              const p = PASTELS[i % PASTELS.length];
              const Icon = f.icon;
              return (
                <div key={f.label} className="rounded-2xl py-4 flex flex-col items-center gap-2" style={{ background: "#ffffffaa" }}>
                  <div className="w-10 h-10 rounded-2xl flex items-center justify-center" style={{ background: p.bg }}>
                    <Icon size={20} color={p.text} />
                  </div>
                  <span className="text-[11px] font-extrabold" style={{ color: "#6E6480" }}>{f.label}</span>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Results — each look shown in full, like the enlarged mood-board card,
          right in the scroll (no tap needed to see the details). */}
      {outfits.length > 0 && (
        <div className="mt-6 space-y-4">
          <div className="flex items-center gap-2 flex-wrap">
            <h2 className="text-lg font-black" style={{ color: "#5A5167" }}>Your {outfits.length} look{outfits.length !== 1 ? "s" : ""}</h2>
          </div>
          {outfits.map((o) => (
            <StylistOutfitCard key={o.id} o={o} pastel={o.pastel} rating={ratings[o.id] || 0} fav={favIds.has(o.id)}
              onRate={handleRate} onFav={toggleFav} onDismiss={handleDismiss} />
          ))}
        </div>
      )}

      {/* FAB */}
      <div className="fixed left-0 right-0 flex justify-center pointer-events-none" style={{ bottom: 92, maxWidth: 430, margin: "0 auto" }}>
        {remaining <= 0 ? (
          <button onClick={goProfile}
            className="pointer-events-auto flex items-center gap-2 px-7 py-4 rounded-full font-black text-white text-[15px] active:scale-95 transition-transform"
            style={{ background: "linear-gradient(135deg,#C6BCD2,#A99FB5)", boxShadow: "0 12px 30px -6px #00000022" }}>
            <Lock size={19} /> Out of generations today
          </button>
        ) : (
          <button onClick={generate} disabled={generating}
            className="pointer-events-auto flex items-center gap-2 px-7 py-4 rounded-full font-black text-white active:scale-95 transition-transform"
            style={{ background: "linear-gradient(135deg,#FBB8D2,#D6B5F0)", boxShadow: "0 12px 30px -6px #F3B6D0aa, 0 4px 10px #00000015" }}>
            {generating ? <Loader2 size={22} className="animate-spin" /> : <Sparkles size={22} />}
            <span className="flex flex-col items-center">
              <span className="text-[20px]">{generating ? "Styling…" : "Generate Outfits"}</span>
              {!generating && <span className="text-[10px] font-bold text-white">Uses up to 5 generations</span>}
            </span>
          </button>
        )}
      </div>
    </div>
  );
}

/* A closet item card: TAP to open its detail view, SWIPE left to reveal delete. */
function ClosetItemRow({ item, onTrash, onToggleWash, onToggleFav, onOpen }) {
  const REVEAL = 84;
  const [open, setOpen] = useState(false);
  const [drag, setDrag] = useState(null);   // live offset (px, negative) while dragging
  const startX = useRef(null);
  const base = useRef(0);
  const cur = useRef(0);
  const moved = useRef(false);
  const p = PASTELS[item.name.length % 5];

  const down = (e) => {
    startX.current = e.clientX; base.current = open ? -REVEAL : 0; cur.current = base.current; moved.current = false;
    setDrag(base.current);
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
  };
  const mv = (e) => {
    if (startX.current == null) return;
    const dxm = e.clientX - startX.current;
    if (Math.abs(dxm) > 6) moved.current = true;
    cur.current = Math.max(-REVEAL, Math.min(0, base.current + dxm));
    setDrag(cur.current);
  };
  const up = () => {
    if (startX.current == null) return;
    setOpen(cur.current < -REVEAL / 2);
    setDrag(null); startX.current = null;
  };
  const tx = drag != null ? drag : (open ? -REVEAL : 0);

  return (
    <div className="relative overflow-hidden rounded-2xl">
      {/* trash reveal */}
      <div className="absolute right-0 top-0 bottom-0 flex items-center justify-center"
        style={{ background: "#FAD4D4", width: REVEAL }}>
        <button onClick={() => onTrash(item.id)} className="flex flex-col items-center gap-0.5 px-2">
          <Trash2 size={20} color="#D96A6A" />
          <span className="text-[10px] font-extrabold" style={{ color: "#D96A6A" }}>Delete</span>
        </button>
      </div>
      <div className="flex items-center gap-3 p-3"
        style={{ background: "#fff", border: "1.5px solid #F1E6F1", touchAction: "pan-y",
          transform: `translateX(${tx}px)`, transition: drag == null ? "transform .22s cubic-bezier(.2,.8,.2,1)" : "none" }}
        onPointerDown={down} onPointerMove={mv} onPointerUp={up} onPointerCancel={up}
        onClick={() => { if (moved.current) return; if (open) setOpen(false); else if (onOpen) onOpen(item); }}>
        <div className="rounded-2xl flex items-center justify-center shrink-0 overflow-hidden"
          style={{ width: 52, height: 52, background: p.bg }}>
          {item.photo
            ? <img src={item.photo} alt="" className="w-full h-full object-cover" />
            : <CatIcon category={item.category} size={22} color={p.text} />}
        </div>
        <div className="flex-1 min-w-0">
          <div className="text-[15px] font-extrabold truncate" style={{ color: "#5A5167" }}>{item.name}</div>
          <div className="text-[12px] font-semibold" style={{ color: "#A99FB5" }}>{item.color}</div>
        </div>
        <button onClick={(e) => { e.stopPropagation(); if (moved.current) return; onToggleWash(item.id); }}
          onPointerDown={(e) => e.stopPropagation()} onPointerUp={(e) => e.stopPropagation()}
          className="w-9 h-9 rounded-xl flex items-center justify-center" style={{ background: item.wash ? "#E6F2FB" : "#F4EEF5" }}>
          <WashingMachine size={17} color={item.wash ? "#5D87A8" : "#C6BCD2"} />
        </button>
        <button onClick={(e) => { e.stopPropagation(); if (moved.current) return; onToggleFav(item.id); }}
          onPointerDown={(e) => e.stopPropagation()} onPointerUp={(e) => e.stopPropagation()}
          className="w-9 h-9 rounded-xl flex items-center justify-center" style={{ background: item.fav ? "#FDE9F1" : "#F4EEF5" }}>
          <Heart size={17} color={item.fav ? "#E891B5" : "#C6BCD2"} fill={item.fav ? "#E891B5" : "none"} />
        </button>
      </div>
    </div>
  );
}

function ClosetTab({ closet, setCloset, trash, setTrash, goCamera }) {
  const [activeCat, setActiveCat] = useState(null);
  const [activeSub, setActiveSub] = useState(null);
  const [inTrash, setInTrash] = useState(false);
  const [query, setQuery] = useState("");
  const [swiped, setSwiped] = useState(null);
  const [detailId, setDetailId] = useState(null);   // closet item open in the detail window

  const counts = CATEGORIES.reduce((a, c) => {
    a[c.key] = closet.filter((i) => i.category === c.key).length; return a;
  }, {});
  // "Laundry" and "Liked" are cross-cutting views (any category, filtered by
  // wash/fav) rather than real closet categories, so they're counted separately.
  counts.Laundry = closet.filter((i) => i.wash).length;
  counts.Liked = closet.filter((i) => i.fav).length;
  const subCounts = ACCESSORY_SUBCATS.reduce((a, s) => {
    a[s.key] = closet.filter((i) => i.category === "Accessories" && i.subcategory === s.key).length; return a;
  }, {});

  const toggleFav = (id) => setCloset((c) => c.map((i) => i.id === id ? { ...i, fav: !i.fav } : i));
  const toggleWash = (id) => setCloset((c) => c.map((i) => i.id === id ? { ...i, wash: !i.wash } : i));
  const toTrash = (id) => {
    const item = closet.find((i) => i.id === id);
    setCloset((c) => c.filter((i) => i.id !== id));
    setTrash((t) => [item, ...t]);
    setSwiped(null);
  };
  const recover = (id) => {
    const item = trash.find((i) => i.id === id);
    setTrash((t) => t.filter((i) => i.id !== id));
    setCloset((c) => [{ ...item, fav: false, wash: false }, ...c]);
  };
  const purge = (id) => setTrash((t) => t.filter((i) => i.id !== id));
  // Edits from the item detail window.
  const renameItem = (id, name) => setCloset((c) => c.map((i) => i.id === id ? { ...i, name } : i));
  const setItemColor = (id, color) => setCloset((c) => c.map((i) => i.id === id ? { ...i, color } : i));
  const setItemType = (id, category, subcategory) => setCloset((c) => c.map((i) => i.id === id
    ? { ...i, category, subcategory: category === "Accessories" ? (subcategory || i.subcategory || "Jewelry") : null } : i));
  const detailItem = detailId ? closet.find((i) => i.id === detailId) : null;
  const detailModal = (
    <ClosetItemDetail item={detailItem} onClose={() => setDetailId(null)}
      onRename={renameItem} onColor={setItemColor} onType={setItemType} onTrash={toTrash} />
  );

  /* search across everything */
  const searching = query.trim().length > 0;
  const results = closet.filter((i) =>
    i.name.toLowerCase().includes(query.toLowerCase()) ||
    i.category.toLowerCase().includes(query.toLowerCase()) ||
    i.color.toLowerCase().includes(query.toLowerCase()));

  const Thumb = ({ item, size = 52 }) => {
    const p = PASTELS[item.name.length % 5];
    return (
      <div className="rounded-2xl flex items-center justify-center shrink-0 overflow-hidden"
        style={{ width: size, height: size, background: p.bg }}>
        {item.photo
          ? <img src={item.photo} alt="" className="w-full h-full object-cover" />
          : <CatIcon category={item.category} size={size * 0.42} color={p.text} />}
      </div>
    );
  };


  /* ---- Trash view ---- */
  if (inTrash) {
    return (
      <div className="pb-28">
        <button onClick={() => setInTrash(false)} className="flex items-center gap-1.5 text-[14px] font-extrabold mb-4" style={{ color: "#A99FB5" }}>
          <ArrowLeft size={18} /> Closet
        </button>
        <h1 className="text-2xl font-black mb-1" style={{ color: "#5A5167" }}>Trash</h1>
        <p className="text-sm font-semibold mb-5" style={{ color: "#A99FB5" }}>Recover anything you're not ready to let go of.</p>
        {trash.length === 0 ? (
          <div className="text-center py-16 text-[14px] font-bold" style={{ color: "#C6BCD2" }}>Trash is empty — squeaky clean</div>
        ) : (
          <div className="space-y-3">
            {trash.map((item) => (
              <div key={item.id} className="flex items-center gap-3 p-3 rounded-2xl" style={{ background: "#fff", border: "1.5px solid #F1E6F1" }}>
                <Thumb item={item} />
                <div className="flex-1 min-w-0">
                  <div className="text-[15px] font-extrabold truncate" style={{ color: "#5A5167" }}>{item.name}</div>
                  <div className="text-[12px] font-semibold" style={{ color: "#A99FB5" }}>{item.category} · {item.color}</div>
                </div>
                <button onClick={() => recover(item.id)} className="px-3 py-2 rounded-xl text-[12px] font-extrabold flex items-center gap-1" style={{ background: "#E8F6EC", color: "#6BA37C" }}>
                  <RotateCcw size={14} /> Recover
                </button>
                <button onClick={() => purge(item.id)} className="px-3 py-2 rounded-xl text-[12px] font-extrabold" style={{ background: "#FAD4D4", color: "#D96A6A" }}>
                  Delete

  /* ---- Accessories sub-category grid ---- */
  if (activeCat === "Accessories" && !activeSub) {
